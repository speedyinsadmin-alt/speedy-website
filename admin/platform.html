<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Platform Console — Speedy Insurance</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --navy:#0e1533; --navy2:#161f45; --line:rgba(255,255,255,.09);
    --red:#e03131; --blue:#4d7cfe; --green:#2fbf71; --amber:#f5a623;
    --ink:#f2f5ff; --mute:#8f9ac4; --radius:14px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--navy);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 16px 60px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
  h1{font-size:19px;margin:0;letter-spacing:.2px}
  h1 small{color:var(--mute);font-weight:400;font-size:13px;margin-left:8px}
  .who{margin-left:auto;color:var(--mute);font-size:13px}
  #gate{background:var(--navy2);border:1px solid var(--line);border-radius:var(--radius);padding:38px 24px;text-align:center;max-width:420px;margin:12vh auto}
  #gate p{color:var(--mute);margin:8px 0 20px}
  #gsibtn{display:flex;justify-content:center}
  #app{display:none}
  nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  nav button{background:var(--navy2);border:1px solid var(--line);color:var(--mute);padding:9px 16px;border-radius:10px;font-size:14px;cursor:pointer}
  .mini{background:var(--navy2);border:1px solid var(--line);color:var(--mute);padding:6px 13px;border-radius:9px;font-size:13px;cursor:pointer}
  .mini.on{color:var(--ink);border-color:var(--blue);background:rgba(77,124,254,.12)}
  nav button.on{color:var(--ink);border-color:var(--blue);background:rgba(77,124,254,.12)}
  .card{background:var(--navy2);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
  .card h2{font-size:14px;margin:0 0 10px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--mute);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  td .pill{white-space:nowrap}
  td.stat{white-space:nowrap}
  td.cli{max-width:230px}
  tr:last-child td{border-bottom:0}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
  .perchip{display:inline-block;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:var(--navy);border:1px solid var(--line);color:var(--mute)}
  .perchip.sel{background:var(--blue);border-color:var(--blue);color:#fff}
  .dinput{background:var(--navy);border:1px solid var(--line);border-radius:8px;padding:5px 8px;color:var(--ink);font-size:12px}
  .abtn{display:inline-block;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.12s}
  .abtn.go{background:var(--green,#2fbf71);color:#04220f}
  .abtn.go:hover{filter:brightness(1.08)}
  .abtn.no{background:transparent;color:var(--mute);border:1px solid var(--line)}
  .abtn.no:hover{color:#ff8f8f;border-color:rgba(224,49,49,.5)}
  .agentcard{border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden;transition:.12s}
  .agentcard:hover{border-color:rgba(127,168,255,.45)}
  .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#0b1220;flex-shrink:0}
  .docbtn{display:inline-block;padding:4px 11px;border-radius:8px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;border:1px solid transparent}
  .docbtn.g{background:rgba(47,191,113,.15);color:#7ee2a8;border-color:rgba(47,191,113,.35)}
  .docbtn.r{background:rgba(224,49,49,.15);color:#ff8f8f;border-color:rgba(224,49,49,.35)}
  .docbtn.b{background:rgba(77,124,254,.15);color:#8fadff;border-color:rgba(77,124,254,.35)}
  #docModal{position:fixed;inset:0;background:rgba(6,9,24,.92);z-index:80;padding:20px;overflow-y:auto}
  .docwrap{max-width:1040px;margin:0 auto;background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:16px}
  .docgrid{display:flex;gap:12px;margin-top:12px}
  .doclist{width:230px;flex-shrink:0;max-height:520px;overflow-y:auto}
  .docitem{background:var(--navy);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:6px;cursor:pointer}
  .docitem.sel{border-color:var(--blue)}
  .docitem.carrier{border-color:rgba(47,191,113,.5)}
  .docpane{flex:1;background:#f4f4f2;border-radius:9px;min-height:460px;position:relative}
  .docpane iframe{width:100%;height:460px;border:0;border-radius:9px;display:block}
  .dchip:first-child{margin-left:0}
  td.docs,th.docs{white-space:nowrap;width:1%;text-align:right}
  .pill.g{background:rgba(47,191,113,.15);color:var(--green)}
  .pill.a{background:rgba(245,166,35,.15);color:var(--amber)}
  .pill.r{background:rgba(224,49,49,.15);color:var(--red)}
  .pill.b{background:rgba(77,124,254,.15);color:var(--blue)}
  .kv{display:grid;grid-template-columns:170px 1fr;gap:4px 12px;font-size:13px}
  .kv b{color:var(--mute);font-weight:600}
  pre{background:#0a0f26;border:1px solid var(--line);border-radius:10px;padding:12px;font:12px/1.5 var(--mono);overflow:auto;max-height:420px;margin:10px 0 0}
  .raw-t{color:var(--blue);font-size:13px;cursor:pointer;user-select:none;margin-top:10px;display:inline-block}
  .muted{color:var(--mute)}
  .err{color:var(--red)}
  .load{color:var(--mute);padding:24px;text-align:center}
  .amount{font-family:var(--mono)}
  @media(max-width:640px){.kv{grid-template-columns:1fr}.hidemob{display:none}}
</style>
<!-- build v3.5 -->
</head>
<body>
<div class="wrap">

  <div id="gate">
    <h1>Platform Console</h1>
    <p>Speedy Platform — internal build console.<br>Sign in to continue.</p>
    <div id="gsibtn"></div>
    <p id="gateerr" class="err" style="display:none">This account isn't authorized for the console.</p>
  </div>

  <div id="app">
    <header>
      <div class="dot"></div>
      <h1>Platform Console <small id="ver">v5.8</small></h1>
      <div class="who" id="who"></div>
    </header>
    <nav>
      <button data-tab="clients" class="on">Clients</button>
      <button data-tab="hs">ZZTEST · HawkSoft</button>
      <button data-tab="ledger">Ledger</button>
      <button data-tab="calls">Calls</button>
      <button data-tab="audit">Audit</button>
      <button data-tab="tables">Tables</button>
      <button data-tab="health">Health</button>
    </nav>
    <div id="view" class="card"><div class="load">Loading…</div></div>
  </div>

</div>
<script>
const GOOGLE_CLIENT_ID = '495028615728-djctotdqcp1340ef3n8t339q873ok7db.apps.googleusercontent.com';
let TOKEN = null, TAB = 'clients';
const $ = s => document.querySelector(s);

window.addEventListener('load', () => {
  sessionStorage.removeItem('ck'); // clear old password-gate remnant
  const t = setInterval(() => {
    if (!window.google) return;
    clearInterval(t);
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onCred, auto_select: false, cancel_on_tap_outside: true });
    google.accounts.id.renderButton($('#gsibtn'), { theme: 'filled_blue', size: 'large', width: 260 });
    google.accounts.id.disableAutoSelect();
  }, 150);
});

async function onCred(resp) {
  TOKEN = resp.credential;
  const r = await api('tables');
  if (!r || r.error === 'Not authorized') { $('#gateerr').style.display = 'block'; TOKEN = null; return; }
  $('#gate').style.display = 'none';
  $('#app').style.display = 'block';
  $('#who').textContent = r.email || '';
  render();
}

async function api(view) {
  try {
    const r = await fetch('/api/platform?view=' + view, { headers: { 'x-id-token': TOKEN } });
    return await r.json();
  } catch { return null; }
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); TAB = b.dataset.tab; render();
});

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ONE docs button per row. Three chips wrapped in a narrow column and buried the
// signal; a single button shows the audit state (green = carrier receipt on file,
// red = missing) plus the file count, and opens the document viewer.
// Performance: only metadata is held here — file bytes are fetched when a file is clicked.
const DOC_ROWS = {};
/* A partial payment must be visible to the owner: the charge amount alone hides that
   money is still outstanding and that commission is only part-released. */
// how much of an earned commission has actually been released by collections
function releasedNote(r){
  const ratio = r.collected_ratio != null ? Number(r.collected_ratio) : 1;
  if(r.commission == null || ratio >= 0.995) return '';
  return '<div style="font-size:10.5px;color:var(--amber);font-weight:400;white-space:nowrap">'
    + money(r.commission * ratio) + ' released</div>';
}

function balanceCell(r){

  const owed = r.total_owed != null ? Number(r.total_owed) : null;
  const got  = r.collected != null ? Number(r.collected) : Number(r.amount || 0);
  if(owed == null || owed <= got + 0.005) return '';
  const left = owed - got;
  const pct = Math.round((got / owed) * 100);
  return '<div style="font-size:10.5px;color:var(--amber);white-space:nowrap">'
    + money(left) + ' still owed \u00b7 ' + pct + '% collected</div>';
}

function docsCell(docs, needsProof, rowKey, title){
  const own   = docs.filter(d => d.payment_id === rowKey);
  const other = docs.filter(d => d.payment_id !== rowKey);
  DOC_ROWS[rowKey] = { own, other, title };
  const hasCarrier = own.some(d => (d.doc_type || d.kind) === 'carrier_receipt');
  const n = own.length;
  if(!n && !other.length && !needsProof) return '<span class="muted">\u2014</span>';
  const cls = hasCarrier ? 'g' : (needsProof ? 'r' : 'b');
  const label = hasCarrier ? ('\u2713 ' + n + ' file' + (n>1?'s':''))
              : needsProof ? 'No proof'
              : (n ? n + ' file' + (n>1?'s':'') : 'Files');
  return '<span class="docbtn ' + cls + '" onclick="openDocs(\'' + rowKey + '\')">'
       + '<i class="ti"></i>' + label + '</span>';
}
const money = v => isFinite(v) ? '$' + Number(v).toFixed(2) : '—';

let OPEN_CLIENT = null; // client_no currently open in drill-in
async function render() {
  const el = $('#view');
  el.innerHTML = '<div class="load">Loading…</div>';
  if (TAB === 'clients') return OPEN_CLIENT ? renderOurClient(el, OPEN_CLIENT) : renderClients(el);
  if (TAB === 'hs') return renderHS(el);
  if (TAB === 'ledger') return renderLedger(el);
  if (TAB === 'calls') return renderCalls(el);
  if (TAB === 'audit') return renderAudit(el);
  if (TAB === 'health') return renderHealth(el);
  if (TAB === 'tables') return renderTables(el);
}
function openClient(no) {
  OPEN_CLIENT = no;
  TAB = 'clients';
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'clients'));
  render();
}
function closeClient() { OPEN_CLIENT = null; render(); }

async function apiPost(action) {
  try {
    const r = await fetch('/api/platform', { method: 'POST',
      headers: { 'x-id-token': TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify({ action }) });
    return await r.json();
  } catch { return null; }
}

/* ---------- Clients (our platform) ---------- */
let SEARCH_Q = '';
let searchTimer = null;
function clientTable(list, counts) {
  if (!list.length) return '<div class="muted" style="padding:18px 0">No matches.</div>';
  return '<table><tr><th>#</th><th>Name</th><th class="hidemob">Branch</th><th>Status</th><th>Policies</th></tr>'
    + list.map(c => {
      const name = c.business_name || [c.first_name, c.last_name].filter(Boolean).join(' ') || '(no name)';
      const pc = (counts || {})[c.client_no] || { total: 0, inforce: 0, dmv: 0 };
      return '<tr style="cursor:pointer" onclick="openClient(' + c.client_no + ')">'
        + '<td class="amount">' + esc(c.client_no) + '</td>'
        + '<td><b>' + esc(name) + '</b></td>'
        + '<td class="hidemob">' + esc(c.branch || '—') + '</td>'
        + '<td><span class="pill ' + (String(c.status).toLowerCase() === 'active' ? 'g' : 'a') + '">' + esc(c.status) + '</span></td>'
        + '<td>' + pc.inforce + ' in-force / ' + pc.total + (pc.dmv ? ' · ' + pc.dmv + ' DMV' : '') + '</td>'
        + '</tr>';
    }).join('') + '</table>';
}

async function renderClients(el) {
  const r = await api('our_clients' + (SEARCH_Q ? '&q=' + encodeURIComponent(SEARCH_Q) : ''));
  if (!r || !r.ok) { el.innerHTML = '<div class="err">Client list failed' + (r && r.error ? ': ' + esc(r.error) : '') + '.</div>'; return; }
  const list = r.clients || [];
  const label = SEARCH_Q
    ? list.length + ' match' + (list.length === 1 ? '' : 'es') + ' for \u201c' + esc(SEARCH_Q) + '\u201d'
    : 'showing first ' + list.length + ' \u00b7 search to find any client';
  let h = '<div style="display:flex;align-items:center;gap:12px;margin-bottom:4px">'
    + '<h2 style="margin:0">Clients — Speedy Platform</h2>'
    + '<button id="deltabtn" style="margin-left:auto;background:var(--blue);border:0;color:#fff;padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer">⟳ Sync changes now</button>'
    + '<button id="seedbtn" style="background:var(--navy);border:1px solid var(--line);color:var(--mute);padding:8px 14px;border-radius:9px;font-size:13px;cursor:pointer">⇊ Full seed</button>'
    + '<button id="resyncbtn" style="background:var(--amber);border:0;color:#2a1a00;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer">↻ Re-sync all fields</button>'
    + '</div>'
    + '<div id="syncline" class="muted" style="font-size:13px;margin:2px 0 12px">checking sync status…</div>'
    + '<div id="seedprog" class="muted" style="display:none;font-size:13px;margin:4px 0 10px"></div>'
    + '<input id="csearch" placeholder="Search name, client #, phone, or email…" value="' + esc(SEARCH_Q) + '" '
    + 'style="width:100%;max-width:380px;margin:6px 0 6px;padding:10px 13px;border-radius:9px;border:1px solid var(--line);background:#0a0f26;color:var(--ink);font-size:14px">'
    + '<div class="muted" style="font-size:12px;margin-bottom:12px">' + label + '</div>'
    + '<div id="ctable">' + clientTable(list, r.policy_counts) + '</div>';
  el.innerHTML = h;

  const srch = $('#csearch');
  srch.focus();
  srch.setSelectionRange(srch.value.length, srch.value.length);
  srch.oninput = () => {
    clearTimeout(searchTimer);
    const val = srch.value;
    searchTimer = setTimeout(async () => {
      SEARCH_Q = val.trim();
      const rr = await api('our_clients' + (SEARCH_Q ? '&q=' + encodeURIComponent(SEARCH_Q) : ''));
      if (rr && rr.ok) {
        $('#ctable').innerHTML = clientTable(rr.clients || [], rr.policy_counts);
        const lbl = srch.parentElement.querySelector('#csearch + .muted');
        if (lbl) lbl.textContent = SEARCH_Q
          ? (rr.clients || []).length + ' match' + ((rr.clients || []).length === 1 ? '' : 'es') + ' for \u201c' + SEARCH_Q + '\u201d'
          : 'showing first ' + (rr.clients || []).length + ' \u00b7 search to find any client';
      }
    }, 300);
  };

  $('#seedbtn').onclick = () => seedAll(false);
  const rb = $('#resyncbtn'); if (rb) rb.onclick = () => startServerResync();
  $('#deltabtn').onclick = async () => {
    const b = $('#deltabtn'); b.disabled = true; b.textContent = 'Syncing…';
    const rr = await apiPostBody({ action: 'delta_sync' });
    b.disabled = false; b.textContent = '⟳ Sync changes now';
    const line = $('#syncline');
    if (rr && rr.ok) {
      line.textContent = rr.partial
        ? 'Synced ' + rr.processed + ' of ' + rr.changed + ' changed clients so far (' + rr.clients + ' updated). Press Sync again to continue — a long gap takes a few passes.'
        : 'Just synced — ' + rr.clients + ' clients and ' + rr.policies + ' policies updated (' + (rr.changed || 0) + ' changed in HawkSoft).';
    }
    else {
      line.textContent = 'Sync failed' + (rr && rr.error ? ': ' + rr.error
        : ' — it did not finish in time. Press Sync again; it continues where it stopped.') + '.';
    }
  };
  loadSyncStatus();
  (async () => { const st = await api('job_status'); if (st && st.job && (st.job.status==='running'||st.job.status==='pending')) pollResync(); })();
}

let resyncPoll = null;
async function startServerResync() {
  const btn = $('#resyncbtn'), prog = $('#seedprog');
  btn.disabled = true; btn.textContent = 'Starting…';
  if (prog) { prog.style.display = 'block'; prog.textContent = 'Building client list on the server…'; }
  const r = await apiPostBody({ action: 'start_resync' });
  if (!r || !r.ok) { btn.disabled = false; btn.textContent = '↻ Re-sync all fields'; if (prog) prog.textContent = 'Could not start' + (r&&r.error?': '+r.error:'') + '.'; return; }
  pollResync();
}
async function pollResync() {
  const btn = $('#resyncbtn'), prog = $('#seedprog');
  if (resyncPoll) clearInterval(resyncPoll);
  const tick = async () => {
    const st = await api('job_status');
    const j = st && st.job;
    if (!j) { if (prog) prog.textContent = 'No active job.'; stopResync(); return; }
    const pct = j.total ? Math.round(100 * (j.processed||0) / j.total) : 0;
    if (prog) { prog.style.display='block'; prog.textContent = 'Re-syncing on server: ' + (j.processed||0) + ' / ' + j.total + ' (' + pct + '%) · ' + (j.clients_updated||0) + ' clients, ' + (j.policies_updated||0) + ' policies · safe to close this tab'; }
    if (btn) { btn.disabled = true; btn.textContent = 'Re-syncing ' + pct + '%'; }
    if (j.status === 'done') { if (prog) prog.textContent = 'Re-sync complete — ' + (j.clients_updated||0) + ' clients, ' + (j.policies_updated||0) + ' policies classified.'; stopResync(); if (btn){btn.disabled=false;btn.textContent='↻ Re-sync all fields';} render(); return; }
    // nudge the server to do another chunk (also progresses if cron is idle)
    apiPostBody({ action: 'step_resync' });
  };
  await tick();
  resyncPoll = setInterval(tick, 6000);
}
function stopResync(){ if (resyncPoll) { clearInterval(resyncPoll); resyncPoll = null; } }

async function loadSyncStatus() {
  const line = $('#syncline'); if (!line) return;
  const r = await api('sync_status');
  if (!r || !r.ok) { line.textContent = 'Sync status unavailable.'; return; }
  const rb = $('#resyncbtn');

  // A job is actively running — show live progress, disable the button
  if (r.job && (r.job.status === 'running' || r.job.status === 'pending')) {
    const j = r.job;
    const pct = j.total ? Math.round(j.processed / j.total * 1000) / 10 : 0;
    line.innerHTML = '<span style="color:var(--amber,#f5a623)">● Re-sync running</span> — <b>' + pct + '%</b> · '
      + (j.processed || 0).toLocaleString() + ' / ' + (j.total || 0).toLocaleString() + ' clients · '
      + (j.policies_updated || 0).toLocaleString() + ' policies updated'
      + '<div style="height:7px;background:var(--navy);border-radius:5px;overflow:hidden;margin-top:5px;max-width:420px"><div style="height:100%;width:' + pct + '%;background:var(--amber,#f5a623);transition:width .4s"></div></div>';
    if (rb) { rb.disabled = true; rb.textContent = 'Re-sync in progress…'; rb.style.opacity = '0.5'; rb.style.cursor = 'not-allowed'; }
    // auto-refresh the status every 5s while running
    clearTimeout(window._syncStatusT);
    window._syncStatusT = setTimeout(loadSyncStatus, 5000);
    return;
  }

  // No job running — show last completed + normal button
  if (rb) { rb.disabled = false; rb.textContent = '↻ Re-sync all fields'; rb.style.opacity = '1'; rb.style.cursor = 'pointer'; }
  let parts = [];
  if (r.last_complete) {
    const t = new Date(r.last_complete.updated_at);
    const mins = Math.round((Date.now() - t.getTime()) / 60000);
    const ago = mins < 1 ? 'just now' : mins < 60 ? mins + ' min ago' : mins < 1440 ? Math.round(mins/60) + ' hr ago' : Math.round(mins/1440) + ' days ago';
    parts.push('Last full re-sync: <b>' + ago + '</b> (' + (r.last_complete.processed || 0).toLocaleString() + ' clients)');
  }
  if (r.state && r.state.last_sync) {
    const t2 = new Date(r.state.last_sync);
    const m2 = Math.round((Date.now() - t2.getTime()) / 60000);
    const ago2 = m2 < 1 ? 'just now' : m2 < 60 ? m2 + ' min ago' : Math.round(m2/60) + ' hr ago';
    parts.push('nightly sync ' + ago2);
  }
  line.innerHTML = (parts.length ? parts.join(' · ') : 'No sync recorded yet') + ' · <span class="muted">live refresh when you open a client</span>';
}

async function apiPostBody(payload) {
  try {
    const r = await fetch('/api/platform', { method: 'POST',
      headers: { 'x-id-token': TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify(payload) });
    return await r.json();
  } catch { return null; }
}

async function seedAll(force) {
  const btn = force ? $('#resyncbtn') : $('#seedbtn'), prog = $('#seedprog');
  btn.disabled = true; btn.textContent = 'Fetching client list…';
  prog.style.display = 'block'; prog.textContent = 'Asking HawkSoft for all client IDs…';
  const idsRes = await apiPostBody({ action: 'seed_ids', force: !!force });
  if (!idsRes || !idsRes.ok) { prog.textContent = 'Could not fetch client IDs' + (idsRes && idsRes.error ? ': ' + idsRes.error : '') + '.'; btn.disabled = false; btn.textContent = force ? '↻ Re-sync all fields' : '⇊ Full seed'; return; }
  const ids = idsRes.ids || [];
  if (idsRes.already) prog.textContent = idsRes.already + ' clients already in — resuming with the remaining ' + ids.length + '.';
  if (!ids.length) { prog.textContent = 'All ' + (idsRes.total || idsRes.already) + ' clients are already seeded. Nothing to do.'; btn.disabled = false; btn.textContent = force ? '↻ Re-sync all fields' : '⇊ Full seed'; return; }
  let done = 0, clients = 0, pols = 0;
  for (let i = 0; i < ids.length; i += 25) {
    const batch = ids.slice(i, i + 25);
    btn.textContent = 'Seeding… ' + Math.round(100 * i / ids.length) + '%';
    prog.textContent = 'Seeding clients ' + (i + 1) + '–' + Math.min(i + 25, ids.length) + ' of ' + ids.length + ' — ' + clients + ' saved, ' + pols + ' policies so far';
    const r = await apiPostBody({ action: 'seed_batch', ids: batch });
    if (r && r.error === 'Not authorized') {
      prog.textContent = '⚠ Session expired at ' + clients + ' clients saved. Refresh the page, sign in again, and press Seed — it resumes where it stopped.';
      btn.textContent = force ? '↻ Re-sync all fields' : '⇊ Full seed'; btn.disabled = false; return;
    }
    if (r && r.ok) { clients += r.upserted; pols += r.policies; }
    done = i + batch.length;
  }
  prog.textContent = 'Done — ' + clients + ' clients and ' + pols + ' policies seeded from HawkSoft (' + done + ' IDs processed).';
  btn.textContent = force ? '↻ Re-sync all fields' : '⇊ Full seed'; btn.disabled = false;
  OPEN_CLIENT = null; render();
}

const SECTION_STATE = {}; // remembers expand/collapse across clients
function section(key, title, count, bodyHtml, opts) {
  opts = opts || {};
  const empty = !count;
  // default: insurance open, others collapsed; empty auto-collapsed; remember overrides
  let open = SECTION_STATE[key];
  if (open === undefined) open = opts.defaultOpen && !empty;
  const chevron = open ? '▾' : '▸';
  const dim = empty ? 'opacity:.5' : '';
  return '<div class="sec" style="' + dim + '">'
    + '<div class="sechead" data-sec="' + key + '" onclick="toggleSection(\'' + key + '\')" style="cursor:pointer;display:flex;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line)">'
    + '<span class="chev" style="color:var(--mute);width:14px">' + chevron + '</span>'
    + '<b style="font-size:14px;letter-spacing:.4px;text-transform:uppercase;color:var(--mute)">' + title + '</b>'
    + '<span class="pill b" style="margin-left:2px">' + count + '</span>'
    + (opts.note ? '<span class="muted" style="font-size:12px;margin-left:4px">' + opts.note + '</span>' : '')
    + '</div>'
    + '<div class="secbody" style="' + (open ? '' : 'display:none') + ';padding-bottom:8px">' + (empty ? '<div class="muted" style="padding:4px 0 12px">' + (opts.emptyText || 'Nothing here.') + '</div>' : bodyHtml) + '</div>'
    + '</div>';
}
function toggleSection(key) {
  const head = document.querySelector('[data-sec="' + key + '"]');
  if (!head) return;
  const body = head.nextElementSibling;
  const chev = head.querySelector('.chev');
  const open = body.style.display === 'none';
  body.style.display = open ? '' : 'none';
  if (chev) chev.textContent = open ? '▾' : '▸';
  SECTION_STATE[key] = open; // remember for next client
}

function policyRows(list, isDmv) {
  const today = new Date().toISOString().slice(0,10);
  if (isDmv) {
    const head = '<table><tr><th>Service #</th><th>Term</th><th class="hidemob">Period</th><th>Renews</th><th>Status</th></tr>';
    const rows = list.map(p => {
      const exp = p.expiration_date || '';
      let badge = '<span class="muted">expired</span>';
      if (exp) {
        const days = Math.round((new Date(exp) - new Date()) / 86400000);
        if (days < 0) badge = '<span class="muted">expired</span>';
        else if (days <= 30) badge = '<span class="pill a">renew in ' + days + 'd</span>';
        else badge = '<span class="pill g">current</span>';
      }
      const isLatest = p._latest ? ' <span class="pill b" style="font-size:10px">latest</span>' : '';
      return '<tr>'
        + '<td>' + esc(p.policy_number || '—') + isLatest + '</td>'
        + '<td>' + (p.renewal_months ? p.renewal_months + ' mo' : '—') + '</td>'
        + '<td class="hidemob">' + esc(p.effective_date || '') + ' → ' + esc(exp) + '</td>'
        + '<td>' + badge + '</td>'
        + '<td>' + esc(p.status || '—') + '</td>'
        + '</tr>';
    }).join('');
    return head + rows + '</table>';
  }
  // Insurance: each policy is an expandable card revealing drivers, vehicles, coverages
  return list.map((p, i) => {
    const st = String(p.status || '').toLowerCase();
    const live = p.expiration_date && p.expiration_date >= today && !['cancelled','canceled','expired'].includes(st);
    const ce = p.carrier_extras || {};
    const drivers = ce.drivers || [];
    const autos = ce.autos || [];
    const coverages = ce.coverages || [];
    const pid = 'pol_' + (p.id || i);
    const open = POL_OPEN[pid];
    // monthly estimate (also shown in the collapsed header)
    const _plan = ce.billingPlan || '';
    const _prem = Number(p.premium) || Number(ce.premium) || null;
    const _m = String(_plan).match(/(\d+)/);
    const _nPay = _m ? Number(_m[1]) : null;
    const _perPay = (_prem && _nPay) ? (_prem / _nPay) : null;
    const header = '<div onclick="togglePol(\'' + pid + '\')" style="cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--navy);border:1px solid var(--line);border-radius:10px;margin-bottom:' + (open?'0':'8px') + '">'
      + '<span class="chev2" style="color:var(--mute);width:12px">' + (open?'▾':'▸') + '</span>'
      + '<div style="flex:1"><b>' + esc(p.policy_number || '—') + '</b> <span class="muted" style="font-size:12px">· ' + esc(p.carrier || '—') + '</span></div>'
      + '<span class="muted hidemob" style="font-size:12px">' + esc(p.effective_date||'') + ' → ' + esc(p.expiration_date||'') + '</span>'
      + (_perPay ? '<span style="font-size:13px;font-weight:700;color:#7fa8ff;white-space:nowrap">' + money(_perPay) + '<span style="font-size:10px;font-weight:400;color:var(--mute)">/mo</span></span>' : '')
      + '<span class="amount muted" style="font-size:12px" title="term premium">' + money(p.premium) + '</span>'
      + (live ? '<span class="pill g">in force</span>' : '<span class="pill a">' + esc(p.status||'—') + '</span>')
      + '</div>';
    if (!open) return header;

    // Drivers
    let dHtml = '';
    if (drivers.length) {
      dHtml = '<div style="margin:10px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:700">Drivers (' + drivers.length + ')</div>'
        + '<table><tr><th>Name</th><th>Role</th><th class="hidemob">DOB</th><th class="hidemob">License</th><th>SR-22</th><th>Points</th></tr>'
        + drivers.map(d => {
            const rel = String(d.relationship||'').toLowerCase();
            const status = String((d.personalInfo&&d.personalInfo.status)||'').toLowerCase();
            const role = (rel==='insured'||status==='principal') ? '<span class="pill g">named insured</span>'
                       : status==='excluded' ? '<span class="pill a">excluded</span>'
                       : '<span class="pill b">' + esc((d.personalInfo&&d.personalInfo.status)||'driver') + '</span>';
            const sr22 = (d.sR22 && d.sR22.hasSR22) ? '<span class="pill a">SR-22</span>' : '—';
            const pts = (d.mvRs && d.mvRs.points!=null) ? d.mvRs.points : '—';
            return '<tr>'
              + '<td>' + esc([d.firstName,d.middleName,d.lastName].filter(Boolean).join(' ')) + '</td>'
              + '<td>' + role + '</td>'
              + '<td class="hidemob">' + esc(String(d.dateOfBirth||'').slice(0,10)) + '</td>'
              + '<td class="hidemob">' + esc(d.licenseNumber||'—') + ' ' + esc(d.licenseState||'') + '</td>'
              + '<td>' + sr22 + '</td>'
              + '<td>' + pts + '</td>'
              + '</tr>';
          }).join('') + '</table>';
    }
    // Vehicles
    let vHtml = '';
    if (autos.length) {
      vHtml = '<div style="margin:14px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:700">Vehicles (' + autos.length + ')</div>'
        + '<table><tr><th>Year / Make / Model</th><th class="hidemob">VIN</th><th class="hidemob">Use</th><th>Premium</th></tr>'
        + autos.map(a => '<tr>'
            + '<td>' + esc([a.year,a.make,a.model].filter(Boolean).join(' ')) + '</td>'
            + '<td class="hidemob amount" style="font-size:11px">' + esc(a.vin||'—') + '</td>'
            + '<td class="hidemob">' + esc(a.use||'—') + '</td>'
            + '<td class="amount">' + money(a.totalPremium) + '</td>'
            + '</tr>').join('') + '</table>';
    }
    // Coverages
    let cHtml = '';
    if (coverages.length) {
      cHtml = '<div style="margin:14px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:700">Coverages (' + coverages.length + ')</div>'
        + '<table><tr><th>Coverage</th><th>Limits</th><th class="hidemob">Deductible</th><th>Premium</th></tr>'
        + coverages.map(cv => '<tr>'
            + '<td>' + esc(cv.description||cv.code||'—') + '</td>'
            + '<td>' + esc(cv.limits||'—') + '</td>'
            + '<td class="hidemob">' + esc(cv.deductibles||'—') + '</td>'
            + '<td class="amount">' + (cv.premium?money(cv.premium):'—') + '</td>'
            + '</tr>').join('') + '</table>';
    }
    // Billing summary — what an agent gets asked on every call
    const billPlan = ce.billingPlan || '—';
    const billType = ce.billingType || '—';
    const nTerms = Number(ce.numberOfTerms) || null;
    const prem = _prem;
    const planMatch = String(billPlan).match(/(\d+)/);
    const nPay = _nPay;
    const perPay = _perPay;
    const isDirect = String(billType).toLowerCase()==='direct';
    // Hero payment card (highlighted) + supporting details
    const heroPay = perPay
      ? '<div style="display:flex;align-items:baseline;gap:10px;background:linear-gradient(135deg,rgba(77,124,254,.18),rgba(47,191,113,.10));border:1px solid rgba(77,124,254,.4);border-radius:12px;padding:14px 18px;margin:8px 0 4px">'
        + '<div><div style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:700;margin-bottom:2px">Est. monthly payment</div>'
        + '<span style="font-size:26px;font-weight:800;color:#7fa8ff;letter-spacing:-.5px">' + money(perPay) + '</span>'
        + ' <span class="muted" style="font-size:12px">× ' + nPay + ' payments</span></div>'
        + '<div style="margin-left:auto;text-align:right"><div class="muted" style="font-size:11px">Term premium</div><span class="amount" style="font-size:15px">' + money(prem) + '</span></div>'
        + '</div>'
      : '';
    const billHtml = '<div style="margin:10px 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:700">Billing</div>'
      + heroPay
      + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 16px;font-size:13px;padding:6px 0 2px">'
      + '<div><span class="muted" style="font-size:11px;display:block">Billing type</span>' + esc(billType) + (isDirect?' <span class="pill b" style="font-size:10px">carrier bills client</span>':'') + '</div>'
      + '<div><span class="muted" style="font-size:11px;display:block">Payment plan</span>' + esc(billPlan) + '</div>'
      + (nTerms?('<div><span class="muted" style="font-size:11px;display:block">Term length</span>' + nTerms + ' months</div>'):'')
      + '</div>'
      + (isDirect?'<div class="muted" style="font-size:11px;margin-top:3px">↳ Exact amount &amp; next due are on the carrier portal for direct-bill policies. Monthly shown is an estimate.</div>':'');
    const detail = '<div style="border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:6px 14px 14px;margin-bottom:8px;background:rgba(255,255,255,.02)">'
      + billHtml
      + (dHtml||vHtml||cHtml ? (dHtml+vHtml+cHtml) : '<div class="muted" style="padding:8px 0">No detailed data stored for this policy.</div>')
      + '<div style="margin-top:10px"><span class="raw-t" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display===\'block\'?\'none\':\'block\'">▸ Raw policy JSON</span>'
      + '<pre style="display:none">' + esc(JSON.stringify(ce,null,2)) + '</pre></div>'
      + '</div>';
    return header + detail;
  }).join('');
}

async function renderOurClient(el, no, _bg) {
  const r = await api('our_client&no=' + no + (_bg ? '&refresh=1' : ''));
  if (!r || !r.ok || !r.client) { el.innerHTML = '<div class="err">Client load failed.</div>'; return; }
  const c = r.client;
  const name = c.business_name || [c.first_name, c.last_name].filter(Boolean).join(' ') || '(no name)';
  const today = new Date().toISOString().slice(0,10);

  const all = r.policies || [];
  const insurance = all.filter(p => (p.record_type || 'insurance') === 'insurance');
  let dmv = all.filter(p => p.record_type === 'dmv_service');
  // latest DMV per client = max expiration_date; drives the registration reminder
  if (dmv.length) {
    dmv = dmv.slice().sort((a,b) => String(b.expiration_date||'').localeCompare(String(a.expiration_date||'')));
    dmv[0]._latest = true;
  }
  const dmvLatest = dmv[0];
  let dmvReminder = '';
  if (dmvLatest && dmvLatest.expiration_date) {
    const d = Math.round((new Date(dmvLatest.expiration_date) - new Date())/86400000);
    if (d >= 0 && d <= 30) dmvReminder = '<span class="pill a">DMV renewal in ' + d + 'd</span>';
  }
  const other = all.filter(p => p.record_type === 'unknown');
  const inforce = insurance.filter(p => { const st=String(p.status||'').toLowerCase(); return p.expiration_date && p.expiration_date>=today && !['cancelled','canceled','expired'].includes(st); }).length;

  // ---- Summary bar (always visible) ----
  let h = '<span class="raw-t" onclick="closeClient()" style="margin:0 0 10px;display:inline-block">← All clients</span>'
    + (r.live ? '<span class="pill g" style="float:right">● live from HawkSoft</span>' : '<span class="pill b" style="float:right;cursor:pointer" onclick="refreshClient(' + no + ')">↻ refresh from HawkSoft</span>');
  h += '<h2 style="margin:0 0 2px">' + esc(name) + ' <span class="muted" style="font-weight:400">· #' + esc(c.client_no) + '</span></h2>';
  const clientActive = String(c.status||'').toLowerCase()==='active';
  const lapsed = clientActive && insurance.length > 0 && inforce === 0;
  const prospect = insurance.length === 0 && dmv.length === 0;
  h += '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 4px">'
    + '<span class="pill ' + (clientActive?'g':'a') + '">' + esc(c.status || '—') + '</span>'
    + (lapsed ? '<span class="pill a">⚠ no in-force policies</span>' : '')
    + '<span class="muted">' + esc(c.branch || 'No branch') + '</span>'
    + (c.phone ? '<a href="tel:' + esc(c.phone) + '" style="color:var(--blue);text-decoration:none">' + esc(c.phone) + '</a>' : '')
    + (c.email ? '<a href="mailto:' + esc(c.email) + '" style="color:var(--blue);text-decoration:none">' + esc(c.email) + '</a>' : '')
    + '<span class="pill b">' + inforce + ' in-force / ' + insurance.length + ' policies</span>'
    + (dmv.length ? '<span class="pill ' + (dmvReminder?'a':'b') + '" style="background:rgba(77,124,254,.12)">' + dmv.length + ' DMV</span>' : '')
    + (dmvReminder || '')
    + '</div>';
  h += '<div class="muted" style="font-size:13px;margin-bottom:6px">' + esc([c.address1, c.city, c.state, c.zip].filter(Boolean).join(', ') || 'No address on file') + '</div>';

  // ---- Collapsible sections ----
  h += section('ins_' + no, 'Insurance policies', insurance.length, policyRows(insurance, false),
    { defaultOpen: true, emptyText: 'No insurance policies.' });
  h += section('dmv_' + no, 'DMV / Services', dmv.length, policyRows(dmv, true),
    { defaultOpen: false, emptyText: 'No DMV services.',
      note: dmvLatest && dmvLatest.expiration_date ? 'latest reg exp ' + dmvLatest.expiration_date : '' });
  if (other.length) h += section('unk_' + no, 'Unclassified', other.length, policyRows(other, false),
    { defaultOpen: false, note: 'needs review', emptyText: '' });

  // one classifier for every ledger "kind" badge: a declined charge must never read green
  const kindPill = k => {
    const t = String(k || '');
    if (/declin|fail|error|void|refund/i.test(t)) return 'r';
    if (/captured|pending/i.test(t)) return 'a';
    return t.includes('charge') ? 'g' : 'b';
  };
  const payBody = '<table><tr><th>When</th><th>Type</th><th>Amount</th><th class="hidemob">Purpose</th><th class="hidemob">Office</th><th>Ref</th></tr>'
    + (r.payments||[]).map(p => '<tr>'
      + '<td>' + esc(String(p.ts).replace('T',' ').slice(0,16)) + '</td>'
      + '<td><span class="pill ' + kindPill(p.kind) + '">' + esc(p.kind) + '</span></td>'
      + '<td class="amount">' + money(p.amount) + '</td>'
      + '<td class="hidemob">' + esc(p.purpose || '—') + '</td>'
      + '<td class="hidemob">' + esc((p.extra && p.extra.office) || '—') + '</td>'
      + '<td>' + esc(p.ref || '—') + '</td></tr>').join('') + '</table>';
  h += section('pay_' + no, 'Payments', (r.payments||[]).length, payBody,
    { defaultOpen: false, note: 'via Speedy platform', emptyText: 'No payments recorded yet.' });

  const actBody = '<table><tr><th>When</th><th>Event</th><th class="hidemob">By</th><th>Source</th></tr>'
    + (r.events||[]).map(e => '<tr>'
      + '<td>' + esc(String(e.ts).replace('T',' ').slice(0,16)) + '</td>'
      + '<td><span class="pill a">' + esc(e.kind) + '</span></td>'
      + '<td class="hidemob">' + esc(e.actor || '—') + '</td>'
      + '<td>' + esc(e.source || '—') + '</td></tr>').join('') + '</table>';
  h += section('act_' + no, 'History (audit trail)', (r.events||[]).length, actBody,
    { defaultOpen: false, emptyText: 'No activity yet.' });

  el.innerHTML = h;

  // First open (not a bg pass) and data isn't live yet -> silently refresh once from HawkSoft
  if (!_bg && !r.live && OPEN_CLIENT === no) {
    setTimeout(() => { if (OPEN_CLIENT === no) renderOurClient(el, no, true); }, 50);
  }
}

function refreshClient(no) {
  const el = $('#view');
  if (el) renderOurClient(el, no, true);
}

  const rows = r.rows || [];

  if (!rows.length) {
    h += '<div class="muted">No rows yet. First real charge from Sammy\u2019s pilot will land here — this is the A1 verification view.</div>';
  } else {
    const cols = Object.keys(rows[0]);
    const pick = ['ts','kind','client_id','amount','purpose','agent','ref','invoice_status'].filter(c => cols.includes(c));
    const shown = pick.length >= 4 ? pick : cols.slice(0, 8);
    h += '<table><tr>' + shown.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr>'
      + rows.map(row => '<tr>' + shown.map(c => {
          let v = row[c];
          if (c === 'ts' && v) v = String(v).replace('T',' ').slice(0,19);
          if (c === 'amount' && isFinite(v)) return '<td class="amount">' + money(v) + '</td>';
          if (c === 'invoice_status' || c === 'kind') return '<td><span class="pill ' + (String(v).match(/paid|ok|success/i) ? 'g' : String(v).match(/fail|void|refund|declin|error/i) ? 'r' : 'a') + '">' + esc(v) + '</span></td>';
          return '<td>' + esc(v) + '</td>';
        }).join('') + '</tr>').join('') + '</table>';
  }
  h += '<span class="raw-t" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display===\'block\'?\'none\':\'block\'">▸ Raw JSON</span>'
    + '<pre style="display:none">' + esc(JSON.stringify(rows, null, 2)) + '</pre>';
  el.innerHTML = h;
}

    const g = byAgent[a];
    g.tx.push(x);
    g.fees += (x.fee||0);

            + (x.charged_by_other ? '<div class="muted" style="font-size:10.5px">charged by ' + esc(String(x.charged_by||'').split(' ')[0]) + '</div>' : '')
            + '</td>'
          + '<td><span class="pill b">'+(x.path==='dmv_service'?'DMV':x.path==='insurance'?'Insurance':esc(x.path||'—'))+'</span></td>'
          + '<td class="amount">'+money(x.amount)+balanceCell(x)+'</td>'
          + '<td class="amount">'+(x.fee!=null?money(x.fee):'—')+'</td>'
          + '<td class="amount">'+(x.commission!=null?'<b style="color:#7fa8ff">'+money(x.commission)+'</b>':(x.fee!=null?'<span class="muted">'+money(x.fee*x.pct/100)+'?</span>':'—'))+releasedNote(x)+'</td>'

let AUDIT_CACHE = null;

       : AUDIT_PERIOD==='yesterday' ? 'yesterday'

async function renderAudit(el){
  el.innerHTML = '<h2>Audit — full transaction trail</h2>' + auditSubNav() + '<div class="muted">Loading…</div>';
  let r;
  try { r = await api('audit_list' + (AUDIT_Q ? '&q=' + encodeURIComponent(AUDIT_Q) : '')); }
  catch(e){ el.innerHTML = auditSubNav() + '<div class="err">Load error: ' + esc(String(e&&e.message||e)) + '</div>'; return; }
  if(!r){ el.innerHTML = auditSubNav() + '<div class="err">No response from server (audit_list). It may be redeploying — try again in a moment.</div>'; return; }
  if(!r.ok){ el.innerHTML = auditSubNav() + '<div class="err">Server error: ' + esc(r.error||'unknown') + '</div>'; return; }
  AUDIT_CACHE = r;
  if(AUDIT_SUB === 'agents'){
    try { el.innerHTML = (await renderCorrections()) + '<h2>Audit — commission by agent</h2>' + auditSubNav() + renderAgentView(r); }
    catch(e){ el.innerHTML = auditSubNav() + '<div class="err">By-agent render error: ' + esc(String(e&&e.message||e)) + '</div>'; }
    return;
  }
  const rows = r.rows || [];
  const atts = r.attachments || [];
  window.AUDIT_ROWS = {}; rows.forEach(x => window.AUDIT_ROWS[x.id] = x);

  const pathLabel = p => p==='dmv_service' ? 'DMV service' : p==='insurance' ? 'Insurance' : p==='pre_audit' ? 'Pre-audit' : (p||'—');
  const statusPill = row => {
    if(row.pre_audit) return '<span class="muted" title="Charged before the proof-of-payment process">—</span>';
    const s = row.audit_status;
    if(s==='complete') return '<span class="pill g">complete</span>';
    if(s==='ready_for_audit') return '<span class="pill b">ready for review</span>';
    if(s==='carrier_pending') return '<span class="pill a">docs pending</span>';
    return '<span class="pill a">needs audit</span>';
  };

  // Date filter — "Total fees" with no period read like a business number when it was
  // really "everything ever recorded". Totals below are always for the selected period.
  const inPeriod = ts => {
    if(AUDIT_PERIOD === 'all') return true;
    const d = String(ts||'').slice(0,10);
    if(!d) return false;
    const today = new Date(); const iso = x => x.toISOString().slice(0,10);
    if(AUDIT_PERIOD === 'today')     return d === iso(today);
    if(AUDIT_PERIOD === 'yesterday'){ const y = new Date(today); y.setDate(y.getDate()-1); return d === iso(y); }
    if(AUDIT_PERIOD === 'month')     return d.slice(0,7) === iso(today).slice(0,7);
    if(AUDIT_PERIOD === 'custom')    return (!AUDIT_FROM || d >= AUDIT_FROM) && (!AUDIT_TO || d <= AUDIT_TO);
    return true;
  };
  const allRows = rows;
  const periodRows = allRows.filter(x => inPeriod(x.ts));

  const totFees = periodRows.reduce((a,x)=> a + (x.fee||0), 0);
  const totComm = periodRows.reduce((a,x)=> a + (x.commission||0), 0);
  const auditedCount = periodRows.filter(x => x.audit_status === 'complete').length;

  let h = '<h2>Audit — full transaction trail</h2>' + auditSubNav();
  h += '<div class="muted" style="font-size:12.5px;margin:-4px 0 12px">Each charge with its proof of payment (carrier or DMV) and required documents. Commission is earned only when the audit is complete.</div>';

  // search
  h += '<input id="auditSearch" placeholder="Search client name, #, transaction ref, agent, purpose…" value="'+esc(AUDIT_Q)+'" '
    + 'style="width:100%;max-width:520px;background:var(--navy);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--ink);font-size:14px;margin-bottom:12px">';

  const chip = (k,label) => '<span class="perchip'+(AUDIT_PERIOD===k?' sel':'')+'" onclick="setPeriod(\''+k+'\')">'+label+'</span>';
  h += '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px">'
    + chip('today','Today') + chip('yesterday','Yesterday') + chip('month','This month')
    + chip('all','All time') + chip('custom','Custom')
    + (AUDIT_PERIOD==='custom'
        ? '<span style="display:flex;gap:6px;align-items:center;margin-left:6px">'
          + '<input type="date" id="auditFrom" value="'+esc(AUDIT_FROM||'')+'" onchange="setRange()" class="dinput">'
          + '<span class="muted" style="font-size:12px">to</span>'
          + '<input type="date" id="auditTo" value="'+esc(AUDIT_TO||'')+'" onchange="setRange()" class="dinput"></span>'
        : '')
    + '</div>';
  h += '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:13px">'
    + '<span class="muted">'+periodRows.length+' transaction'+(periodRows.length===1?'':'s')+'</span>'
    + '<span class="muted">·</span><span>Fees '+esc(periodLabel())+': <b class="amount">'+money(totFees)+'</b></span>'
    + '<span class="muted">·</span><span>Commission earned: <b class="amount" style="color:#7fa8ff">'+money(totComm)+'</b></span>'
    + (auditedCount < periodRows.length
        ? '<span class="muted">·</span><span class="muted" title="Fees only exist once an audit is complete">'
          + auditedCount + ' of ' + periodRows.length + ' audited</span>'
        : '')
    + '</div>';
  const pendingCount = periodRows.filter(x=>x.receipt_pending).length;
  if(pendingCount){
    h += '<div style="border:1px solid #e03131;background:rgba(224,49,49,.12);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px"><b style="color:#e03131">\u26a0 '+pendingCount+' charge'+(pendingCount>1?'s':'')+' captured but receipt not completed</b> — card was charged but the receipt/HawkSoft step did not finish. These need attention.</div>';
  }

  h += '<table><tr><th>When</th><th>Client</th><th>Path</th><th>Charge</th><th class="hidemob">Cost</th><th>Fee</th><th class="hidemob">Agent</th><th>Comm.</th><th>Status</th><th class="docs">Docs</th></tr>';
  if(!periodRows.length) h += '<tr><td colspan="10" class="muted">No transactions in this period.</td></tr>';
  for(const row of periodRows){
    const docs = atts.filter(a => (a.payment_id===row.id) || (a.client_no===row.client_no));
    const docCell = docsCell(docs, !row.pre_audit && row.audit_status !== 'complete', row.id, (row.client_name||('#'+row.client_no))+' \u00b7 '+money(row.amount));
    const nm = row.client_name ? esc(row.client_name) : '';
    const canComplete = !row.pre_audit && row.audit_status !== 'complete';
    const completeBtn = canComplete ? '<span class="raw-t" style="color:#f5a623;font-weight:600" onclick="completeAudit(\''+row.id+'\')">+ proof</span>' : '';
    h += '<tr>'
      + '<td class="muted" style="font-size:12px">'+esc(String(row.ts||'').replace('T',' ').slice(0,16))+'</td>'
      + '<td class="cli"><span class="raw-t" onclick="openClient('+row.client_no+')">'+(nm?nm+' ':'')+'#'+row.client_no+'</span></td>'
      + '<td><span class="pill b">'+pathLabel(row.path)+'</span></td>'
      + '<td class="amount">'+money(row.amount)+balanceCell(row)+'</td>'
      + '<td class="amount hidemob">'+(row.service_cost!=null?money(row.service_cost):'—')+'</td>'
      + '<td class="amount">'+(row.fee!=null?money(row.fee):'—')+'</td>'
      + '<td class="hidemob muted" style="font-size:12px">'+esc((row.agent||'').split('@')[0]||'—')+'</td>'
      + '<td class="amount">'+(row.commission!=null?'<b style="color:#7fa8ff">'+money(row.commission)+'</b>':(row.fee!=null?'<span class="muted" title="earned when audit complete">'+money(row.fee*row.pct/100)+'?</span>':'—'))+releasedNote(row)+'</td>'
      + '<td class="stat">'+(row.receipt_pending?'<span class="pill" style="background:rgba(224,49,49,.2);color:#ff8787">\u26a0 pending</span> ':'')+statusPill(row)+(completeBtn?' '+completeBtn:'')+'</td>'
      + '<td class="docs">'+docCell+'</td>'
      + '</tr>';
  }
  h += '</table>';

  // pre-audit note
  if(periodRows.some(x=>x.pre_audit)) h += '<div class="muted" style="font-size:12px;margin-top:10px">— Transactions marked "—" were charged before the proof-of-payment process began; no audit documents are required for them.</div>';

  el.innerHTML = h;
  const si = document.getElementById('auditSearch');
  if(si){
    si.oninput = () => { AUDIT_Q = si.value; clearTimeout(window._auditT); window._auditT = setTimeout(()=>render(), 350); };
    si.focus(); si.setSelectionRange(si.value.length, si.value.length);
  }
}

function completeAudit(id){
  const row = (window.AUDIT_ROWS||{})[id];
  if(!row){ alert('Transaction not found'); return; }
  const params = new URLSearchParams({
    client: row.client_no, name: row.client_name||'', paid: row.amount||'',
    payment_id: id||'', method: 'client paid', svc: row.path||''
  });
  // Pass token via localStorage (same origin, reliable across tabs) + hash as fallback
  try { if(TOKEN) localStorage.setItem('speedy_handoff_tok', TOKEN); } catch(e){}
  const url = '/admin/carrier.html?' + params.toString() + (TOKEN ? '#tok=' + encodeURIComponent(TOKEN) : '');
  window.open(url, '_blank');
}

/* ---------- Document viewer ----------
   Opens the files for one payment. PERFORMANCE: the audit list carries metadata only
   (filename, type, size) — never file bytes. A file's bytes are fetched on click,
   turned into a Blob URL and rendered inline. Blob URLs are revoked on close so a
   long session doesn't hold megabytes in memory. */
let DOC_URLS = [];
function docKind(d){ return d.doc_type || d.kind || 'document'; }
function docLabel(k){
  return k === 'carrier_receipt' ? 'Carrier receipt'
       : k === 'client_receipt'  ? 'Speedy receipt'
       : String(k).replace(/_/g, ' ');
}
function fmtBytes(b){
  if(!b) return '';
  return b < 1024 ? b + ' B' : b < 1048576 ? Math.round(b/1024) + ' KB' : (b/1048576).toFixed(1) + ' MB';
}
function openDocs(rowKey){
  const entry = DOC_ROWS[rowKey];
  if(!entry) return;
  const rank = k => k === 'carrier_receipt' ? 0 : k === 'client_receipt' ? 2 : 1;
  const bySort = (a,b) => rank(docKind(a)) - rank(docKind(b));
  const own   = (entry.own   || []).slice().sort(bySort);
  const other = (entry.other || []).slice().sort(bySort);
  const docs  = own.concat(other);
  let el = document.getElementById('docModal');
  if(!el){ el = document.createElement('div'); el.id = 'docModal'; document.body.appendChild(el); }
  el.innerHTML = '<div class="docwrap">'
    + '<div style="display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:11px;border-bottom:1px solid var(--line)">'
    + '<div><div style="font-size:15px;font-weight:700">Documents</div>'
    + '<div class="muted" style="font-size:12px;margin-top:2px">' + esc(entry.title || '') + ' \u00b7 ' + own.length + ' file' + (own.length===1?'':'s') + ' on this payment</div></div>'
    + '<div onclick="closeDocs()" style="cursor:pointer;color:var(--mute);font-size:20px;padding:0 4px">\u2715</div></div>'
    + '<div class="docgrid"><div class="doclist" id="docList"></div>'
    + '<div class="docpane" id="docPane"><div class="muted" style="padding:18px;font-size:13px">Select a file to view it.</div></div></div>'
    + '<div style="display:flex;gap:8px;margin-top:12px;align-items:center">'
    + '<button class="btn" onclick="docDownload()" id="docDl" style="display:none">Download</button>'

const DOC_SORTED = {};
let DOC_CUR = null;
async function showDoc(rowKey, i){
  const docs = DOC_SORTED[rowKey] || [];
  const d = docs[i]; if(!d) return;
  document.querySelectorAll('.docitem').forEach(x => x.classList.remove('sel'));
  const li = document.getElementById('di'+i); if(li) li.classList.add('sel');
  const pane = document.getElementById('docPane');
  pane.innerHTML = '<div class="muted" style="padding:18px;font-size:13px">Loading ' + esc(d.filename||'file') + '\u2026</div>';
  const r = await api('attachment_get&id=' + encodeURIComponent(d.id));
  if(!r || !r.ok || (!r.file_b64 && !r.blob_url)){
    pane.innerHTML = '<div style="padding:18px;font-size:13px;color:#a32d2d">No file is stored for this record.</div>';
    return;
  }
  let url = r.blob_url;
  if(!url){
    try{
      let b64 = r.file_b64; if(b64.startsWith('data:')) b64 = b64.split(',')[1] || '';
      const bin = atob(b64), arr = new Uint8Array(bin.length);
      for(let j=0;j<bin.length;j++) arr[j] = bin.charCodeAt(j);
      url = URL.createObjectURL(new Blob([arr], { type: r.mime || 'application/pdf' }));
      DOC_URLS.push(url);
    }catch(e){
      pane.innerHTML = '<div style="padding:18px;font-size:13px;color:#a32d2d">That file could not be opened.</div>';
      return;
    }
  }
  DOC_CUR = { url, name: r.filename || d.filename || 'document.pdf', mime: r.mime || '' };
  const isImg = /^image\//.test(DOC_CUR.mime);
  pane.innerHTML = isImg
    ? '<img src="' + url + '" style="max-width:100%;max-height:460px;display:block;margin:0 auto;border-radius:9px">'
    : '<iframe src="' + url + '"></iframe>';
  document.getElementById('docDl').style.display = '';
  document.getElementById('docNt').style.display = '';
  document.getElementById('docNote').textContent = fmtBytes(d.bytes) + (d.filed_hawksoft ? ' \u00b7 filed to HawkSoft' : ' \u00b7 not filed to HawkSoft');
}
// Thumbnails load after the list is on screen, for this payment only.
async function loadThumbs(rowKey){
  try{
    const r = await api('thumbs&payment_id=' + encodeURIComponent(rowKey));
    if(!r || !r.ok || !r.thumbs || !r.thumbs.length) return;
    const map = {}; r.thumbs.forEach(t => map[t.id] = t.thumb_b64);
    (DOC_SORTED[rowKey] || []).forEach((d, i) => {
      if(!map[d.id]) return;

      img.src = map[d.id]; img.alt = '';
      img.style.cssText = 'width:100%;height:70px;object-fit:cover;border-radius:6px;margin:5px 0 0;display:block';
      li.insertBefore(img, li.children[1] || null);
    });
  }catch(e){}
}

async function viewAttachment(id){
  const r = await api('attachment_get&id='+encodeURIComponent(id));
  if(!r || !r.ok){ alert('Could not load document — no file stored for this record.'); return; }
  if(r.blob_url){ window.open(r.blob_url, '_blank'); return; }
  if(!r.file_b64){ alert('No file stored for this record.'); return; }
  try {
    // Decode base64 → Blob → object URL. Data-URIs this large fail silently in iframes;
    // a Blob URL renders reliably at any size (the 1.96MB "signed app" was opening blank before).
    let b64 = r.file_b64;
    if(b64.startsWith('data:')) b64 = b64.split(',')[1] || '';
    const bin = atob(b64);
    const len = bin.length;
    const bytes = new Uint8Array(len);
    for(let i=0;i<len;i++) bytes[i] = bin.charCodeAt(i);
    const blob = new Blob([bytes], { type: r.mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    // free the memory after the tab has had time to load it
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  } catch(e){
    alert('Could not open the document: ' + e.message);
  }
}

async function renderSystemHealth(){
  const r = await api('system_health');
  if(!r || !r.ok) return '<div class="err" style="margin-top:20px">Could not load system health.</div>';
  const mb = b => (b/1048576);
  const fmt = b => b >= 1073741824 ? (b/1073741824).toFixed(2)+' GB' : (b/1048576).toFixed(1)+' MB';
  const dbBytes = r.db_bytes||0, attBytes = r.attachments_bytes||0;
  const dbWarn = r.thresholds.db_warn, dbCrit = r.thresholds.db_crit;
  const attWarn = r.thresholds.att_warn;
  const dbPct = Math.min(100, dbBytes / (8*1073741824) * 100);   // vs 8GB Pro cap
  const attPct = Math.min(100, attBytes / attWarn * 100);         // vs 500MB warn line

  const barColor = pct => pct >= 90 ? '#e03131' : pct >= 70 ? '#f5a623' : '#2fbf71';

  let h = '<h2 style="margin-top:26px">System health</h2>';
  h += '<div class="muted" style="font-size:12px;margin:-4px 0 12px">Storage usage and capacity. Updated live · '+esc(String(r.generated_at||'').replace('T',' ').slice(0,16))+'</div>';

  // alerts
  if(r.alerts && r.alerts.length){
    for(const a of r.alerts){
      const col = a.level==='critical' ? '#e03131' : '#f5a623';
      h += '<div style="border:1px solid '+col+';background:'+col+'1a;border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:13px"><b style="color:'+col+'">'+(a.level==='critical'?'⚠ CRITICAL':'⚠ Warning')+':</b> '+esc(a.msg)+'</div>';
    }
  } else {
    h += '<div style="border:1px solid var(--green,#2fbf71);background:rgba(47,191,113,.1);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px"><b style="color:#2fbf71">✓ Healthy</b> — all storage well within limits.</div>';
  }

  // DB usage bar (vs 8GB Pro)
  h += '<div style="margin-bottom:16px">';
  h += '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>Database total</span><span><b>'+fmt(dbBytes)+'</b> <span class="muted">/ 8 GB (Pro)</span></span></div>';
  h += '<div style="height:10px;background:var(--navy);border-radius:6px;overflow:hidden"><div style="height:100%;width:'+dbPct.toFixed(1)+'%;background:'+barColor(dbPct)+'"></div></div>';
  h += '<div class="muted" style="font-size:11px;margin-top:3px">Warn at '+fmt(dbWarn)+' · plan expansion by then</div>';
  h += '</div>';

  // Attachments usage bar (vs 500MB warn)
  h += '<div style="margin-bottom:18px">';
  h += '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>Inline attachments ('+(r.attachment_count||0)+' files)</span><span><b>'+fmt(attBytes)+'</b> <span class="muted">/ 500 MB (move-to-Blob line)</span></span></div>';
  h += '<div style="height:10px;background:var(--navy);border-radius:6px;overflow:hidden"><div style="height:100%;width:'+attPct.toFixed(1)+'%;background:'+barColor(attPct)+'"></div></div>';
  h += '<div class="muted" style="font-size:11px;margin-top:3px">Receipt/doc PDFs stored in DB. Past 500 MB, move to Blob storage.</div>';
  h += '</div>';

  // per-table breakdown
  h += '<table><tr><th>Table</th><th>Size</th><th>Rows</th><th class="hidemob">Dead rows</th></tr>';
  for(const t of (r.tables||[])){
    h += '<tr><td>'+esc(t.name)+'</td><td class="amount">'+fmt(t.bytes)+'</td><td>'+(t.rows!=null?Number(t.rows).toLocaleString():'—')+'</td><td class="hidemob muted">'+(t.dead_rows||0)+'</td></tr>';
  }
  h += '</table>';
  return h;
}

    : '<span class="pill a">worth a look</span>';

  let h = '<div class="card">';
  h += '<div class="row" style="align-items:flex-start;margin-bottom:6px"><div>'
    + '<h2 style="margin:0">Health check</h2>'
    + '<div class="muted" style="font-size:12.5px;margin-top:3px">Where the money and the paperwork disagree. '
    + esc(r.checked) + ' payments and ' + esc(r.documents) + ' documents examined.</div></div>'
    + '<button class="btn" onclick="render()">Run again</button></div>';

  if (!r.issues.length) {
    h += '<div style="background:rgba(47,191,113,.12);border:1px solid rgba(47,191,113,.4);border-radius:12px;padding:16px;margin-top:10px">'
      + '<div style="font-size:15px;font-weight:800;color:var(--green)">✓ Everything reconciles</div>'
      + '<div class="muted" style="font-size:12.5px;margin-top:3px">Every charge has its receipt, every audit its figures, every payment an owner.</div></div>';
  } else {
    for (const i of r.issues) {
      h += '<div style="border:1px solid ' + (i.sev === 'high' ? 'rgba(224,49,49,.4)' : 'rgba(245,166,35,.4)')
        + ';border-radius:12px;padding:13px;margin-top:10px">'
        + '<div class="row" style="align-items:flex-start"><div>'
        + '<div style="font-size:14px;font-weight:800">' + esc(i.title) + '</div>'
        + '<div class="muted" style="font-size:12px;margin-top:2px">' + esc(i.why) + '</div></div>'
        + '<div style="text-align:right"><div style="font-size:19px;font-weight:800">' + i.count + '</div>'
        + sevPill(i.sev) + '</div></div>';
      h += '<table style="margin-top:9px"><tr><th>When</th><th>Client</th><th>Detail</th><th></th></tr>';
      for (const row of i.rows) {
        h += '<tr><td>' + esc(String(row.ts || '').slice(0, 10)) + '</td>'
          + '<td><span class="raw-t" onclick="openClient(' + (row.client_no || 0) + ')">#' + esc(row.client_no || '—') + '</span></td>'
          + '<td>' + (row.filename ? esc(row.filename) : money(row.amount) + ' · ' + esc(row.kind || ''))
          + (row.audit_status ? ' · ' + esc(row.audit_status) : '') + '</td>'
          + '<td class="muted">' + esc(row.agent ? String(row.agent).split('@')[0] : '') + '</td></tr>';
      }
      h += '</table>';
      if (i.count > i.rows.length) h += '<div class="muted" style="font-size:11.5px;margin-top:6px">Showing ' + i.rows.length + ' of ' + i.count + '.</div>';
      h += '</div>';
    }
  }
  h += '<div class="muted" style="font-size:11px;margin-top:12px">Receipts have only been stored since Aug 5, so earlier charges are not reported as missing one.</div>';
  h += '</div>';
  el.innerHTML = h;
}

async function renderTables(el) {
  const r = await api('tables');
  if (!r || !r.ok) { el.innerHTML = '<div class="err">Table inventory failed.</div>'; return; }
  let h = '<h2>Our database — what exists today</h2>';
  h += '<table><tr><th>Table</th><th>Status</th><th>Rows</th><th>Columns</th></tr>'
    + (r.tables || []).map(t => '<tr>'
      + '<td><span class="amount">' + esc(t.table) + '</span></td>'
      + '<td>' + (t.exists ? '<span class="pill g">live</span>' : '<span class="pill r">missing</span>') + '</td>'
      + '<td>' + (t.rows === null ? '—' : t.rows) + '</td>'
      + '<td class="muted">' + esc((t.columns || []).join(', ') || '—') + '</td>'
      + '</tr>').join('') + '</table>';
  h += '<p class="muted" style="font-size:13px;margin-top:14px">Coming as the platform grows: <b>events</b> · <b>clients</b> · <b>policies</b> (canonical schema, B0) · <b>invoices</b> (A3) · <b>tasks</b> (D1).</p>';
  el.innerHTML = h;
  // append live system-health panel
  try { const hh = await renderSystemHealth(); const d = document.createElement('div'); d.innerHTML = hh; el.appendChild(d); } catch(e){}
}
</script>
</body>
</html>
