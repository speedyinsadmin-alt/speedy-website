<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Speedy Ops</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  /* Deliberately not the portal's navy. This is the operator's view - a status board
     read at a glance, closer to a terminal than to the agent tools. Monospace for
     every number so columns line up and a changed figure is obvious. */
  :root{
    --paper:#12110f; --panel:#1a1916; --rule:#2b2924; --ink:#ece8df;
    --mute:#8c877c; --dim:#5d594f;
    --hot:#e0533d; --warn:#d99a2b; --ok:#4a9e6a; --link:#7ba7d4;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .wrap{max-width:1120px;margin:0 auto;padding:28px 20px 64px}
  a{color:var(--link);text-decoration:none}
  a:hover{text-decoration:underline}
  .hide{display:none!important}

  /* gate */
  #gate{max-width:380px;margin:16vh auto;text-align:center}
  #gate h1{font-size:19px;font-weight:600;letter-spacing:.02em;margin:0 0 6px}
  #gate p{color:var(--mute);font-size:13px;margin:0 0 20px}
  #gsibtn{display:flex;justify-content:center}
  .err{color:var(--hot);font-size:12.5px;margin-top:16px}

  header{border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:22px;
    display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
  header h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.01em}
  header .sub{color:var(--dim);font-size:12px;margin-top:3px}
  header .who{color:var(--mute);font-size:12px}

  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
    gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:26px}
  .cell{background:var(--panel);padding:13px 14px}
  .cell .n{font-size:23px;font-weight:600;letter-spacing:-.01em}
  .cell .k{color:var(--dim);font-size:10.5px;margin-top:3px;letter-spacing:.04em}
  .cell.hot .n{color:var(--hot)} .cell.warn .n{color:var(--warn)} .cell.ok .n{color:var(--ok)}

  h2{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.08em;
    margin:30px 0 11px;padding-bottom:7px;border-bottom:1px solid var(--rule)}

  .item{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13px}
  .item:last-child{border-bottom:0}
  .pri{flex:0 0 46px;font-size:10.5px;padding-top:2px;letter-spacing:.05em}
  .pri.high{color:var(--hot)} .pri.med{color:var(--warn)} .pri.low{color:var(--dim)}
  .who{flex:0 0 46px;color:var(--warn);font-size:10.5px;padding-top:2px}

  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:26px}
  .lk{display:block;padding:6px 0;font-size:13px;border-bottom:1px solid var(--rule)}
  .lk:last-child{border-bottom:0}
  .lk span{color:var(--dim);font-size:11px;display:block}

  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:6px 0;border-bottom:1px solid var(--rule)}
  td:last-child{text-align:right}
  tr:last-child td{border-bottom:0}
  .tot td{font-weight:600;border-top:1px solid var(--rule)}
  .note{color:var(--dim);font-size:11.5px;margin-top:8px}
  footer{margin-top:44px;padding-top:14px;border-top:1px solid var(--rule);
    color:var(--dim);font-size:11.5px}
</style>
</head>
<body>

<!-- Nothing below is populated until an admin signs in. Static files under /admin/
     are fetchable by anyone with the URL, so this file deliberately contains no
     figures, no item text and no links - all of it arrives from the gated
     ops_summary endpoint. Fetch this page unauthenticated and it says nothing. -->
<div class="wrap">

  <div id="gate">
    <h1>Speedy Ops</h1>
    <p>Internal operations console.<br>Sign in to continue.</p>
    <div id="gsibtn"></div>
    <p id="gateerr" class="err hide">This account isn't authorized.</p>
  </div>

  <div id="app" class="hide">
    <header>
      <div>
        <h1>Speedy Ops</h1>
        <div class="sub" id="vers"></div>
      </div>
      <div class="who" id="who"></div>
    </header>

    <div class="strip" id="strip"></div>

    <h2>Needs a decision</h2>
    <div id="decisions"></div>

    <h2>Open</h2>
    <div id="items"></div>

    <h2>Links</h2>
    <div class="cols" id="links"></div>

    <h2>Recurring cost</h2>
    <table id="costs"></table>

    <footer id="foot"></footer>
  </div>

</div>

<script>
const GOOGLE_CLIENT_ID = '495028615728-djctotdqcp1340ef3n8t339q873ok7db.apps.googleusercontent.com';
let TOKEN = null;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

window.addEventListener('load', () => {
  setTimeout(() => {
    if (!window.google || !google.accounts) return;
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onCred,
      auto_select: false, cancel_on_tap_outside: true });
    google.accounts.id.renderButton($('#gsibtn'), { theme: 'filled_blue', size: 'large', width: 260 });
    google.accounts.id.disableAutoSelect();
  }, 150);
});

/* Same gate as the Console, reached the same way. verifyGoogle is deliberately not
   modified - it is what locked the owner out on Aug 30 when it was. */
async function onCred(resp) {
  TOKEN = resp.credential;
  const r = await api('ops_summary');
  if (!r || !r.ok || r.error === 'Not authorized') {
    $('#gateerr').classList.remove('hide'); TOKEN = null; return;
  }
  $('#gate').classList.add('hide');
  $('#app').classList.remove('hide');
  render(r);
}

async function api(view) {
  try {
    const r = await fetch('/api/platform?view=' + view, { headers: { 'x-id-token': TOKEN } });
    return await r.json();
  } catch { return null; }
}

const ago = iso => {
  if (!iso) return 'never';
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 60) return m + 'm ago';
  if (m < 1440) return Math.round(m / 60) + 'h ago';
  return Math.round(m / 1440) + 'd ago';
};

function render(r) {
  const L = r.live || {}, V = r.versions || {};

  $('#who').textContent = 'signed in';
  $('#vers').textContent = 'portal ' + (V.portal || '?') + ' · console ' + (V.console || '?')
    + ' · charge ' + (V.charge || '?') + ' · master file ' + (V.master_file || '?');

  /* Every figure here is counted live. The artifact this replaces said "46 open
     items" and was stale before anyone read it. */
  const inline = L.documents_inline, stored = L.documents_in_storage;
  const cells = [
    { n: L.open_audits, k: 'OPEN AUDITS', c: L.open_audits > 20 ? 'hot' : 'warn' },
    { n: L.payments_30d, k: 'PAYMENTS 30D', c: '' },
    { n: L.agents_active, k: 'ACTIVE AGENTS', c: '' },
    { n: stored + ' / ' + L.documents, k: 'DOCS IN STORAGE', c: stored === L.documents ? 'ok' : 'warn' },
    { n: inline, k: 'STILL INLINE', c: inline ? 'warn' : 'ok' },
    { n: ago(L.last_client_sync), k: 'LAST SYNC', c: '' },
  ];
  $('#strip').innerHTML = cells.map(c =>
    '<div class="cell ' + c.c + '"><div class="n">' + esc(c.n) + '</div>'
    + '<div class="k">' + c.k + '</div></div>').join('');

  $('#decisions').innerHTML = (r.decisions || []).map(d =>
    '<div class="item"><div class="who">' + esc(d.who) + '</div><div>' + esc(d.text) + '</div></div>'
  ).join('') || '<div class="note">Nothing waiting.</div>';

  $('#items').innerHTML = (r.open_items || []).map(i =>
    '<div class="item"><div class="pri ' + esc(i.pri) + '">' + esc(i.pri).toUpperCase() + '</div>'
    + '<div>' + esc(i.text) + '</div></div>').join('');

  $('#links').innerHTML = (r.links || []).map(g =>
    '<div><h2 style="margin-top:0">' + esc(g.group) + '</h2>'
    + g.items.map(x => '<a class="lk" href="' + esc(x.url) + '" target="_blank" rel="noopener">'
        + esc(x.name) + '<span>' + esc(x.url) + '</span></a>').join('')
    + '</div>').join('');

  const C = r.costs || { lines: [] };
  $('#costs').innerHTML = C.lines.map(l =>
    '<tr><td>' + esc(l.name) + (l.note ? ' <span class="note">' + esc(l.note) + '</span>' : '')
    + '</td><td>' + (l.amount == null ? '—' : '$' + l.amount) + '</td></tr>').join('')
    + '<tr class="tot"><td>Fixed monthly</td><td>$' + esc(C.fixed_monthly) + '</td></tr>';

  $('#foot').textContent = 'Generated ' + new Date(r.generated).toLocaleString()
    + ' · counts read live from Supabase · no credentials on this page';
}
</script>
</body>
</html>
