<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Platform Console — Speedy Insurance</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --navy:#0e1533; --navy2:#161f45; --line:rgba(255,255,255,.09);
    --red:#e03131; --blue:#4d7cfe; --green:#2fbf71; --amber:#f5a623;
    --ink:#f2f5ff; --mute:#8f9ac4; --radius:14px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    /* Both of these were already in the file as hardcoded hex - #7fa8ff on the
       commission column, and a dimmer grey improvised with opacity in several places.
       Named here so the Staff page and everything after it stop re-inventing them.
       Checked first: --dim, --card and --blue-l did NOT exist, and assuming they did
       would have been the fourth "CSS that exists in a sibling file" bug today. */
    --dim:#5c6690; --blue-l:#7fa8ff;
  }

  /* ---------- Staff & permissions (item 70 step 4) ----------
     The first version gave 18 people a 155px card each with seven checkboxes: ~2,800px
     of page, 126 boxes, 112 of them empty, and a "Why?" field plus a Save button on
     every row with nothing to save. It gave the NORM (no extra permissions, 16 of 18)
     the same weight as the EXCEPTION (a grant). This is one scannable line per person
     with the editor opening on click. Surfaces use rgba() rather than a new token so
     the rows read correctly on the --navy2 card they sit inside. */
  .sbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .sbar .sq{flex:1;min-width:210px}
  .sbar .sq input{width:100%;background:var(--navy);border:1px solid var(--line);
    border-radius:10px;padding:9px 12px;color:var(--ink);font-size:13.5px}
  .schip{background:transparent;border:1px solid var(--line);color:var(--mute);
    border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .schip.on{background:rgba(77,124,254,.16);border-color:rgba(77,124,254,.55);
    color:var(--blue-l);font-weight:600}
  .schip .n{opacity:.65;font-size:11px;margin-left:3px}
  /* Its own rule because class="go" HAS NO RULE in this file — .go only exists as
     `.abtn.go`, so the Add button rendered as a browser-default white slab, the
     brightest thing on a navy page and next to the quietest action on it. Sixth time
     today that CSS from a sibling file was assumed to be here; found by looking at the
     screenshot, which is the only reason it was found at all. */
  .sadd{background:rgba(77,124,254,.14);border:1px solid rgba(77,124,254,.5);
    color:var(--blue-l);border-radius:10px;padding:9px 15px;font-size:13px;
    font-weight:600;cursor:pointer;white-space:nowrap;width:auto}
  .sadd:hover{background:rgba(77,124,254,.22)}
  .sgrp{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;
    margin:18px 0 7px;padding-left:2px}
  .srow{display:grid;grid-template-columns:1fr 170px 84px 1fr 18px;gap:12px;align-items:center;
    padding:11px 13px;border:1px solid transparent;border-radius:11px;cursor:pointer;transition:.11s}
  .srow:hover{background:rgba(255,255,255,.03);border-color:var(--line)}
  .srow.open{background:rgba(255,255,255,.045);border-color:rgba(77,124,254,.42);
    border-bottom-color:transparent;border-radius:11px 11px 0 0}
  .srow.off{opacity:.62}
  .swho{display:flex;align-items:center;gap:9px;min-width:0}
  .sdot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 auto}
  .sdot.no{background:var(--dim)}
  .snm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sem{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .smeta{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spc{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .srole{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    padding:3px 9px;border-radius:6px;text-align:center;white-space:nowrap}
  .srole.owner{background:rgba(245,166,35,.16);color:var(--amber)}
  .srole.admin{background:rgba(77,124,254,.16);color:var(--blue-l)}
  .srole.agent{background:rgba(143,154,196,.13);color:var(--mute)}
  .sperms{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .sp{font-size:11px;background:rgba(47,191,113,.14);color:#7ee2a8;border-radius:6px;
    padding:2.5px 8px;white-space:nowrap}
  .sp.none{background:transparent;color:var(--dim)}
  .sp.all{background:rgba(245,166,35,.14);color:var(--amber)}
  .scar{color:var(--dim);font-size:12px;text-align:center}
  .stag{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .sedit{background:rgba(255,255,255,.045);border:1px solid rgba(77,124,254,.42);
    border-top:0;border-radius:0 0 11px 11px;padding:0 15px 15px;margin-bottom:8px}
  /* Section headers match the list's group headings, with a hairline, so the editor
     reads as part of the page rather than a form dropped into it. */
  .selab{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;
    margin:15px 0 10px;display:flex;align-items:center;gap:9px}
  .selab::after{content:"";flex:1;height:1px;background:var(--line)}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px 16px}
  .f{display:flex;flex-direction:column;gap:5px;min-width:0}
  .f label{font-size:11px;color:var(--mute)}
  .f input,.f select{width:100%;background:var(--navy);border:1px solid var(--line);
    border-radius:9px;color:var(--ink);padding:9px 11px;font-size:13px}
  .f input:focus,.f select:focus{outline:none;border-color:var(--blue)}
  .f input:disabled,.f select:disabled{opacity:.55;cursor:not-allowed}
  .f .pcin{font-family:var(--mono);text-transform:uppercase}
  .fhint{font-size:10.5px;color:var(--dim);line-height:1.45}
  /* A REAL switch, not a checkbox. A disabled checkbox at low opacity reads as
     unchecked - which is what made "can sign in" look like "never signs in" on Saif's
     screenshot. On and off are now a shape and a colour, not a tick. */
  .ssw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;
    background:var(--navy);border:1px solid var(--line);border-radius:9px;padding:8px 11px;cursor:pointer}
  .ssw input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
  .ssw.dis{opacity:.55;cursor:not-allowed}
  .tog{width:38px;height:21px;border-radius:999px;background:rgba(255,255,255,.14);
    position:relative;flex:0 0 auto;transition:.15s}
  .tog::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;
    border-radius:50%;background:#fff;transition:.15s}
  .ssw.on .tog{background:var(--green)}
  .ssw.on .tog::after{left:20px}
  /* The note carried real context and my first redesign DROPPED it entirely - the exact
     "update the design, update its details" failure. Editable now, at Saif's request. */
  .note{background:rgba(245,166,35,.07);border-left:2px solid var(--amber);
    border-radius:0 8px 8px 0;padding:10px 12px;margin-top:12px}
  .note label{font-size:10.5px;color:var(--amber);text-transform:uppercase;letter-spacing:.06em}
  /* The note is the one field whose whole job is to be READ, and the right height
     depends on the width: 38px clipped Malcolm's third line on a phone, while a fixed
     62px left dead space on a 1280 desktop where the same note is one line. field-sizing
     grows the box to its content, so neither happens; min-height is the fallback for a
     browser without it, and rows="2" in the markup is the last resort. */
  .note textarea{width:100%;background:transparent;border:0;color:var(--mute);
    font-family:inherit;font-size:12.5px;line-height:1.55;resize:vertical;padding:4px 0 0;
    field-sizing:content;min-height:40px}
  .note textarea:focus{outline:none;color:var(--ink)}
  /* PERMISSION PILLS. Three states that cannot be confused: off is outlined and empty,
     on is green with a tick, inherited is amber and not clickable. */
  /* position:relative lives on the ROW, not the pill — see the tooltip rule below. */
  .pills{position:relative;display:flex;flex-wrap:wrap;gap:8px}
  .pill2{display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--line);background:var(--navy);color:var(--mute);border-radius:999px;
    padding:8px 14px 8px 11px;font-size:12.5px;cursor:pointer;transition:.12s;user-select:none}
  .pill2 input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
  .pill2:hover{border-color:rgba(255,255,255,.22)}
  .pill2 .tick{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--dim);
    display:inline-flex;align-items:center;justify-content:center;font-size:11px;
    color:transparent;flex:0 0 auto;transition:.12s}
  .pill2.on{background:rgba(47,191,113,.16);border-color:rgba(47,191,113,.55);color:#a9edc4;font-weight:600}
  .pill2.on .tick{background:var(--green);border-color:var(--green);color:#04220f}
  .pill2.via{background:rgba(245,166,35,.1);border-color:rgba(245,166,35,.35);
    color:var(--amber);cursor:not-allowed}
  .pill2.via .tick{background:var(--amber);border-color:var(--amber);color:#2a1a00}
  .pill2 small{color:var(--dim);font-size:10.5px}
  /* HOVER EXPLANATION, Saif's ask: "when hover on the refund, explain what is this
     for?". Read from data-tip so the same sentence serves the tooltip, the title
     attribute and the tap-friendly list below - one string, three places.

     ANCHORED TO THE ROW (left:0;right:0 against .pills), NOT TO THE PILL. Anchored to
     the pill at a fixed 264px it ran off the screen on every width between 768 and
     1100 - a laptop, or a half-screen window - by up to 93px. I had assumed it fit
     because it fit at 1280. Measured at thirteen widths instead: pinned to the row it
     cannot clip at any of them. It carries its own label (data-lab) so it still says
     which pill it belongs to, and sits BELOW the row, where the reader is already
     looking for the explanation. */
  .pill2[data-tip]:hover::after{content:attr(data-lab) " — " attr(data-tip);
    position:absolute;left:0;right:0;top:calc(100% + 9px);
    background:#060b20;border:1px solid rgba(255,255,255,.16);
    border-radius:10px;padding:10px 13px;font-size:12px;line-height:1.55;color:var(--ink);
    font-weight:400;letter-spacing:0;z-index:40;white-space:normal;text-align:left;
    box-shadow:0 10px 26px rgba(0,0,0,.55);pointer-events:none}
  /* Hover does not exist on a phone, so the same sentences are also a tappable list.
     <details> is native: no state to hold and no handler to wire wrong. */
  .capdefs{margin-top:11px;font-size:12px}
  .capdefs summary{color:var(--blue-l);cursor:pointer;font-size:12px;width:fit-content;
    padding:3px 0;list-style:none}
  .capdefs summary::-webkit-details-marker{display:none}
  .capdefs summary::before{content:"? ";opacity:.7}
  .capdefs dl{margin:9px 0 0;display:grid;gap:8px}
  .capdefs dt{font-size:12px;font-weight:600;color:var(--ink)}
  .capdefs dd{margin:1px 0 0;font-size:11.5px;color:var(--mute);line-height:1.5}
  .sfoot{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);
    margin-top:15px;padding-top:11px;border-top:1px solid var(--line)}
  .sdiff{margin-top:13px;background:rgba(245,166,35,.09);border:1px solid rgba(245,166,35,.4);
    border-radius:9px;padding:9px 12px;font-size:12.5px}
  .sdiff b{color:var(--amber)}
  .ssave{display:flex;gap:9px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .ssave input{flex:1;min-width:180px;background:var(--navy);border:1px solid var(--line);
    border-radius:9px;padding:9px 11px;color:var(--ink);font-size:13px}
  .ssave button{background:var(--green);color:#04220f;border:0;border-radius:9px;
    padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;width:auto;white-space:nowrap}
  .shint{font-size:11.5px;color:var(--dim);line-height:1.5}
  /* ---------- Refunds tab. .will, .lbl AND .row exist in portal.html, NOT here. The
     first two I checked by hand; .row I did not, and the harness caught it before it
     shipped as an unstyled div. */
  .row{display:flex;justify-content:space-between;align-items:center}
  .rq{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-bottom:9px}
  .rqnote{font-size:12.5px;color:var(--mute);margin-top:7px;padding-left:9px;border-left:2px solid rgba(255,255,255,.14)}
  .rqacts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .rqok{background:var(--green);color:#04220f;border:0;border-radius:9px;padding:9px 15px;font-size:12.5px;font-weight:700;cursor:pointer;width:auto;flex:1;min-width:150px}
  .rqno{background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:9px;padding:9px 15px;font-size:12.5px;font-weight:600;cursor:pointer;width:auto;flex:1;min-width:110px}
  /* AUDIT REVIEW (Sep 12). Row actions are small and never stretch; the bulk bar is
     the one loud element and appears only once something is ticked. */
  tr.waitrow td{background:rgba(77,124,254,.06)}
  .selcell{width:26px;padding-right:0}
  .selcell input{width:16px;height:16px;cursor:pointer;accent-color:var(--blue)}
  .rvacts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .aok{background:var(--green);color:#04220f;border:0;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
  .ano{background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
  .aok:disabled,.ano:disabled{opacity:.5;cursor:default}
  .rvsub{font-size:11px;color:var(--mute);margin-top:3px;max-width:240px;line-height:1.35}
  .rvsub i{color:var(--ink);font-style:italic}
  .rvsub .re{color:var(--amber);font-weight:700}
  .rvmsg{font-size:11.5px;margin-top:4px}
  .bulkbar{border:1px solid var(--blue);background:rgba(77,124,254,.10);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .bulkbar b{color:#7fa8ff}
  .bulkbar .hint{color:var(--mute);font-size:12px}
  /* the send-back sheet: a card over the page, same shape as the refund sheet on the portal */
  #sbSheet{position:fixed;inset:0;background:rgba(6,10,26,.72);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
  #sbSheet .sbcard{background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  #sbSheet textarea{width:100%;min-height:72px;background:var(--navy);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:13px;font-family:inherit;margin-top:8px;resize:vertical}
  #sbSheet .sbwhy{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .sbgo{background:var(--red);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;flex:1}
  .sbgo:disabled{opacity:.5;cursor:default}
  .lbl{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:7px;white-space:nowrap}
  .lbl.amber{background:rgba(245,166,35,.15);color:var(--amber)}
  .lbl.green{background:rgba(47,191,113,.15);color:var(--green)}
  .lbl.red{background:rgba(224,49,49,.15);color:#ff7b7b}
  .will{margin:8px 0 0;padding:0;list-style:none;font-size:12px;line-height:1.55}
  .will li{padding:4px 0 4px 18px;position:relative;border-bottom:1px solid var(--line)}
  .will li:last-child{border-bottom:0}
  .will li::before{content:"\2192";position:absolute;left:0;color:var(--dim)}
  .smob{display:none}
  /* MOBILE: STACK, NEVER HIDE. The old breakpoint display:none'd the branch and the
     permissions columns, so a phone LOST information instead of reflowing it. Here the
     row grows a second line and the same facts move onto it. */
  @media(max-width:760px){
    .srow{grid-template-columns:1fr auto;grid-template-areas:"who car" "mob mob";
      gap:8px 10px;padding:12px}
    .swho{grid-area:who}
    .scar{grid-area:car;align-self:start}
    .srow > .smeta,.srow > .sperms,.srow > .srole{display:none}
    .smob{grid-area:mob;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
    .smob .srole{display:inline-block}
    .smob .smeta{display:inline-block;font-size:11.5px}
    .fields{grid-template-columns:1fr}
    .pill2{padding:10px 15px 10px 12px;font-size:13px}
    /* A tap counts as a hover on touch, so the tooltip would stick over the pill after
       toggling it. The <details> list is the phone's answer instead. */
    .pill2[data-tip]:hover::after{display:none}
    .ssave button{width:100%}
    .sedit{padding:0 12px 13px}
    .sfoot{flex-direction:column;gap:3px}
    .sfoot .sep{display:none}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--navy);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  /* 1040 gave the audit table 972px of usable width (1040 - 32 wrap padding - 36 card
     padding) for ten columns that need ~1042. It scrolled, so nothing was lost — but
     the Docs column, which carries the action buttons, started off-screen every time.
     This is an admin console on a desktop, not a reading column: widen the page rather
     than hide money columns or truncate labels. .tscroll stays as the safety net for
     narrow windows. */
  .wrap{max-width:1280px;margin:0 auto;padding:22px 16px 60px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
  h1{font-size:19px;margin:0;letter-spacing:.2px}
  h1 small{color:var(--mute);font-weight:400;font-size:13px;margin-left:8px}
  .who{margin-left:auto;color:var(--mute);font-size:13px}
  #gate{background:var(--navy2);border:1px solid var(--line);border-radius:var(--radius);padding:38px 24px;text-align:center;max-width:420px;margin:12vh auto}
  #gate p{color:var(--mute);margin:8px 0 20px}
  #gsibtn{display:flex;justify-content:center}
  #app{display:none}
  nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  nav button{background:var(--navy2);border:1px solid var(--line);color:var(--mute);padding:9px 16px;border-radius:10px;font-size:14px;cursor:pointer}
  .mini{background:var(--navy2);border:1px solid var(--line);color:var(--mute);padding:6px 13px;border-radius:9px;font-size:13px;cursor:pointer}
  .mini.on{color:var(--ink);border-color:var(--blue);background:rgba(77,124,254,.12)}
  nav button.on{color:var(--ink);border-color:var(--blue);background:rgba(77,124,254,.12)}
  .card{background:var(--navy2);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
  .card h2{font-size:14px;margin:0 0 10px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--mute);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  td .pill{white-space:nowrap}
  /* The status cell used to be nowrap, which forced the pill AND the "+ proof" button
     onto one line and pushed the table's minimum width past its container. The pill
     itself still never breaks (td .pill above); the cell may. */
  td.stat{min-width:112px}
  td.cli{max-width:230px}
  /* Wide tables scroll INSIDE their own box. `table{width:100%}` with several nowrap
     columns has a min-content width larger than the container, so without this the
     audit table spilled past the card and the Docs column was clipped. */
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;padding:0 2px}
  .tscroll table{min-width:760px}
  /* THE TRUST SUMMARY HAD NO CSS AT ALL. `.strip`, `.cell`, `.n` and `.k` are used by
     renderTrust and none of the four had a rule in this file, so the headline figures -
     collected, to carriers, Speedy kept, unaccounted - rendered as a plain vertical
     stack of unstyled text. Found by RENDERING the page and looking at it, which is
     the only way this class of bug shows up: it parses, it runs, it just looks wrong.
     Third instance of "CSS assumed to exist because it exists in a sibling file",
     after .hide/.btn/esc() and carrier.html's .btn/.muted. */
  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 16px}
  .cell{background:var(--navy2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .cell .n{font-size:19px;font-weight:800;font-family:var(--mono);letter-spacing:-.02em;line-height:1.15}
  .cell .k{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
  tr:last-child td{border-bottom:0}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
  .perchip{display:inline-block;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:var(--navy);border:1px solid var(--line);color:var(--mute)}
  .perchip.sel{background:var(--blue);border-color:var(--blue);color:#fff}
  .dinput{background:var(--navy);border:1px solid var(--line);border-radius:8px;padding:5px 8px;color:var(--ink);font-size:12px}

<body>

  </div>

</div>
<script>
const GOOGLE_CLIENT_ID = '495028615728-djctotdqcp1340ef3n8t339q873ok7db.apps.googleusercontent.com';
let TOKEN = null, TAB = 'clients';
const $ = s => document.querySelector(s);

window.addEventListener('load', () => {
  sessionStorage.removeItem('ck'); // clear old password-gate remnant
  const t = setInterval(() => {
    if (!window.google) return;
    clearInterval(t);
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onCred, auto_select: false, cancel_on_tap_outside: true });
    google.accounts.id.renderButton($('#gsibtn'), { theme: 'filled_blue', size: 'large', width: 260 });
    google.accounts.id.disableAutoSelect();
  }, 150);
});

async function onCred(resp) {
  TOKEN = resp.credential;
  const r = await api('tables');
  if (!r || r.error === 'Not authorized') { $('#gateerr').style.display = 'block'; TOKEN = null; return; }
  $('#gate').style.display = 'none';
  $('#app').style.display = 'block';
  $('#who').textContent = r.email || '';
  render();
}

/* An expired Google id token used to come back as {ok:false} and every tab rendered
   its own generic failure - "Call read failed." with no hint that the session had
   simply run out. That is exactly what an app window left open for an hour looks
   like, while a freshly opened tab works, which is how this presented.
   Tokens last about an hour; this page is often left open far longer. */
let AUTH_DEAD = false;
async function api(view) {
  try {
    const r = await fetch('/api/platform?view=' + view, { headers: { 'x-id-token': TOKEN } });
    if (r.status === 401 || r.status === 403) { showAuthExpired(); return { ok: false, expired: true }; }
    return await r.json();
  } catch { return null; }
}
function showAuthExpired() {
  if (AUTH_DEAD) return;                 // one banner, not one per tab render
  AUTH_DEAD = true;
  let b = document.getElementById('authDead');
  if (!b) {
    b = document.createElement('div');
    b.id = 'authDead';
    b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99;background:#f5a623;'
      + 'color:#2a1a00;padding:11px 16px;font-size:13.5px;font-weight:600;text-align:center';
    document.body.appendChild(b);
  }
  b.innerHTML = 'Your sign-in expired — nothing is wrong with the data. '
    + '<span style="text-decoration:underline;cursor:pointer" onclick="location.reload()">Reload to sign in again</span>';
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); TAB = b.dataset.tab; OPEN_CLIENT = null; OPEN_FROM = null; render(); navPush();
});

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ONE docs button per row. Three chips wrapped in a narrow column and buried the
// signal; a single button shows the audit state (green = carrier receipt on file,
// red = missing) plus the file count, and opens the document viewer.
// Performance: only metadata is held here — file bytes are fetched when a file is clicked.
const DOC_ROWS = {};
/* A partial payment must be visible to the owner: the charge amount alone hides that
   money is still outstanding and that commission is only part-released. */
// how much of an earned commission has actually been released by collections
function releasedNote(r){
  const ratio = r.collected_ratio != null ? Number(r.collected_ratio) : 1;
  if(r.commission == null || ratio >= 0.995) return '';
  return '<div style="font-size:10.5px;color:var(--amber);font-weight:400;white-space:nowrap">'
    + money(r.commission * ratio) + ' released</div>';
}

/* PRINT THE ABSOLUTES, not just the remainder. The big number in this column is the
   ONE payment on this row - a card swipe of 130.50 - and there is no total column, no
   collected column and no carrier-cost column in this table. The row said "$20.00
   still owed \u00b7 89% collected" and expected the reader to reconstruct that the client
   owed 184.50 and 164.50 has arrived. Saif could not tell where the total was, which
   is the correct reaction: a remainder and a percentage are not a statement of what
   was owed. Both numbers were already in hand here and were being discarded after
   computing the percentage. Follow-up payments are filtered out of this table
   (audit_list drops balance_of rows), so this line is the only place the rest of the
   money appears at all. */
function balanceCell(r){

  const owed = r.total_owed != null ? Number(r.total_owed) : null;
  const got  = r.collected != null ? Number(r.collected) : Number(r.amount || 0);
  if(owed == null || owed <= got + 0.005) return '';
  const left = owed - got;
  const pct = Math.round((got / owed) * 100);
  return '<div style="font-size:10.5px;color:var(--mute);white-space:nowrap">'
      + money(got) + ' of ' + money(owed) + ' \u00b7 ' + pct + '%</div>'
    + '<div style="font-size:10.5px;color:var(--amber);white-space:nowrap">'
      + money(left) + ' still owed</div>';
}

function docsCell(docs, needsProof, rowKey, title){
  const own   = docs.filter(d => d.payment_id === rowKey);
  const other = docs.filter(d => d.payment_id !== rowKey);
  DOC_ROWS[rowKey] = { own, other, title };
  /* A no-payment document IS the proof on a fee-only charge - there is no carrier
     receipt to have, which is exactly why that path exists. */
  const hasCarrier = own.some(d => {
    const dt = String(d.doc_type || d.kind || '');
    return dt === 'carrier_receipt' || dt.endsWith('_no_payment');
  });
  const n = own.length;
  if(!n && !other.length && !needsProof) return '<span class="muted">\u2014</span>';
  /* One question, one colour: is the proof requirement satisfied?
       green  - yes (a receipt, or a finished fee-only charge with nothing to prove)
       amber  - files are here but the receipt is not
       red    - nothing at all
     Blue used to mean "not green", which is not a meaning: a completed fee-only
     charge and an audit missing its receipt wore the same badge. */
  const settled = hasCarrier || !needsProof;
  const cls = settled ? 'g' : (n ? 'a' : 'r');
  const label = settled ? (n ? ('\u2713 ' + n + ' file' + (n>1?'s':'')) : '\u2713 nothing to prove')
              : (n ? n + ' file' + (n>1?'s':'') + ' \u00b7 no receipt' : 'No proof');
  return '<span class="docbtn ' + cls + '" onclick="openDocs(\'' + rowKey + '\')">'
       + '<i class="ti"></i>' + label + '</span>';
}
/* -$10.90, not $-10.90. carrier.html was fixed this morning and this was left behind —
   the same "fix one reader, leave the other" mistake as the missing total. The minus
   belongs in front of the money, especially on the one figure that should stand out. */
const money = v => !isFinite(v) ? '—'
  : (Number(v) < 0 ? '-$' + Math.abs(Number(v)).toFixed(2) : '$' + Number(v).toFixed(2));
/* A negative fee or commission is red here for the same reason it is red on the carrier
   page: it means the agency lost money on the sale, and it was rendering in plain text
   two columns from a green "complete" pill. */
const signed = v => (isFinite(v) && Number(v) < 0)
  ? '<span style="color:var(--red)">' + money(v) + '</span>' : money(v);

let OPEN_CLIENT = null; // client_no currently open in drill-in
async function render() {
  const el = $('#view');
  el.innerHTML = '<div class="load">Loading…</div>';
  if (TAB === 'clients') return OPEN_CLIENT ? renderOurClient(el, OPEN_CLIENT) : renderClients(el);
  if (TAB === 'hs') return renderHS(el);
  if (TAB === 'ledger') return renderLedger(el);
  if (TAB === 'calls') return renderCalls(el);
  if (TAB === 'audit') return renderAudit(el);
  if (TAB === 'trust') return renderTrust(el);
  if (TAB === 'health') return renderHealth(el);
  if (TAB === 'tables') return renderTables(el);
  if (TAB === 'refunds') return renderRefunds(el);
  if (TAB === 'staff') return renderStaff(el);
}
/* ---------- IN-APP HISTORY (Sep 12) ----------
   A client opened from the Audit tab used to close to "All clients" - the main list,
   not where Tony came from - and the browser's Back left the Console for the sign-in
   screen. Now the drill-in remembers its origin tab, the link reads "Back to Audit",
   and every tab change and drill-in is a history entry the browser's Back walks. */
let OPEN_FROM = null;   // the tab a client was opened FROM, when not 'clients'
const TAB_LABEL = t => { const b = document.querySelector('nav button[data-tab="' + t + '"]'); return b ? b.textContent.trim() : t; };
function syncNav(){ document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.tab === TAB)); }
function navState(){ return { v: 'console', tab: TAB, client: OPEN_CLIENT, from: OPEN_FROM }; }
function navPush(){
  try {
    const cur = history.state, st = navState();
    if(cur && cur.v === 'console' && cur.tab === st.tab && cur.client === st.client) return;
    history.pushState(st, '');
  } catch(e){}
}
function navReplace(){ try { history.replaceState(navState(), ''); } catch(e){} }
window.addEventListener('popstate', e => {
  if(!TOKEN) return;
  const sb = document.getElementById('sbSheet'); if(sb){ closeSendBack(); navPush(); return; }
  const dm = document.getElementById('docModal'); if(dm && dm.innerHTML){ dm.innerHTML = ''; navPush(); return; }
  const st = e.state;
  if(!st || st.v !== 'console'){ navReplace(); return; }
  TAB = st.tab || 'clients'; OPEN_CLIENT = st.client || null; OPEN_FROM = st.from || null;
  syncNav(); render();
});
function openClient(no) {
  OPEN_CLIENT = no;
  if(TAB !== 'clients') OPEN_FROM = TAB;
  TAB = 'clients';
  syncNav();
  render();
  navPush();
}
function closeClient() {
  OPEN_CLIENT = null;
  if(OPEN_FROM){ TAB = OPEN_FROM; OPEN_FROM = null; syncNav(); }
  render();
  navPush();
}

async function apiPost(action) {
  try {
    const r = await fetch('/api/platform', { method: 'POST',
      headers: { 'x-id-token': TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify({ action }) });
    return await r.json();
  } catch { return null; }
}

/* ---------- Clients (our platform) ---------- */
let SEARCH_Q = '';
let searchTimer = null;
function clientTable(list, counts) {
  if (!list.length) return '<div class="muted" style="padding:18px 0">No matches.</div>';
  return '<table><tr><th>#</th><th>Name</th><th class="hidemob">Branch</th><th>Status</th><th>Policies</th></tr>'
    + list.map(c => {
      const name = c.business_name || [c.first_name, c.last_name].filter(Boolean).join(' ') || '(no name)';
      const pc = (counts || {})[c.client_no] || { total: 0, inforce: 0, dmv: 0 };
      return '<tr style="cursor:pointer" onclick="openClient(' + c.client_no + ')">'
        + '<td class="amount">' + esc(c.client_no) + '</td>'
        + '<td><b>' + esc(name) + '</b></td>'
        + '<td class="hidemob">' + esc(c.branch || '—') + '</td>'
        + '<td><span class="pill ' + (String(c.status).toLowerCase() === 'active' ? 'g' : 'a') + '">' + esc(c.status) + '</span></td>'
        + '<td>' + pc.inforce + ' in-force / ' + pc.total + (pc.dmv ? ' · ' + pc.dmv + ' DMV' : '') + '</td>'
        + '</tr>';
    }).join('') + '</table>';
}

async function renderClients(el) {
  const r = await api('our_clients' + (SEARCH_Q ? '&q=' + encodeURIComponent(SEARCH_Q) : ''));
  if (!r || !r.ok) { el.innerHTML = '<div class="err">Client list failed' + (r && r.error ? ': ' + esc(r.error) : '') + '.</div>'; return; }
  const list = r.clients || [];
  const label = SEARCH_Q
    ? list.length + ' match' + (list.length === 1 ? '' : 'es') + ' for \u201c' + esc(SEARCH_Q) + '\u201d'
    : 'showing first ' + list.length + ' \u00b7 search to find any client';
  let h = '<div style="display:flex;align-items:center;gap:12px;margin-bottom:4px">'
    + '<h2 style="margin:0">Clients — Speedy Platform</h2>'
    + '<button id="deltabtn" style="margin-left:auto;background:var(--blue);border:0;color:#fff;padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer">⟳ Sync changes now</button>'
    + '<button id="seedbtn" style="background:var(--navy);border:1px solid var(--line);color:var(--mute);padding:8px 14px;border-radius:9px;font-size:13px;cursor:pointer">⇊ Full seed</button>'
    + '<button id="resyncbtn" style="background:var(--amber);border:0;color:#2a1a00;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer">↻ Re-sync all fields</button>'
    + '</div>'
    + '<div id="syncline" class="muted" style="font-size:13px;margin:2px 0 12px">checking sync status…</div>'
    + '<div id="seedprog" class="muted" style="display:none;font-size:13px;margin:4px 0 10px"></div>'
    + '<input id="csearch" placeholder="Search name, client #, phone, or email…" value="' + esc(SEARCH_Q) + '" '
    + 'style="width:100%;max-width:380px;margin:6px 0 6px;padding:10px 13px;border-radius:9px;border:1px solid var(--line);background:#0a0f26;color:var(--ink);font-size:14px">'
    + '<div class="muted" style="font-size:12px;margin-bottom:12px">' + label + '</div>'
    + '<div id="ctable">' + clientTable(list, r.policy_counts) + '</div>';
  el.innerHTML = h;

  const srch = $('#csearch');
  srch.focus();
  srch.setSelectionRange(srch.value.length, srch.value.length);
  srch.oninput = () => {
    clearTimeout(searchTimer);
    const val = srch.value;
    searchTimer = setTimeout(async () => {
      SEARCH_Q = val.trim();
      const rr = await api('our_clients' + (SEARCH_Q ? '&q=' + encodeURIComponent(SEARCH_Q) : ''));
      if (rr && rr.ok) {
        $('#ctable').innerHTML = clientTable(rr.clients || [], rr.policy_counts);
        const lbl = srch.parentElement.querySelector('#csearch + .muted');
        if (lbl) lbl.textContent = SEARCH_Q
          ? (rr.clients || []).length + ' match' + ((rr.clients || []).length === 1 ? '' : 'es') + ' for \u201c' + SEARCH_Q + '\u201d'
          : 'showing first ' + (rr.clients || []).length + ' \u00b7 search to find any client';
      }
    }, 300);
  };

  $('#seedbtn').onclick = () => seedAll(false);
  const rb = $('#resyncbtn'); if (rb) rb.onclick = () => startServerResync();
  $('#deltabtn').onclick = async () => {
    const b = $('#deltabtn'); b.disabled = true; b.textContent = 'Syncing…';
    const rr = await apiPostBody({ action: 'delta_sync' });
    b.disabled = false; b.textContent = '⟳ Sync changes now';
    const line = $('#syncline');
    if (rr && rr.ok) {
      line.textContent = rr.partial
        ? 'Synced ' + rr.processed + ' of ' + rr.changed + ' changed clients so far (' + rr.clients + ' updated). Press Sync again to continue — a long gap takes a few passes.'
        : 'Just synced — ' + rr.clients + ' clients and ' + rr.policies + ' policies updated (' + (rr.changed || 0) + ' changed in HawkSoft).';
    }
    else {
      line.textContent = 'Sync failed' + (rr && rr.error ? ': ' + rr.error
        : ' — it did not finish in time. Press Sync again; it continues where it stopped.') + '.';
    }
  };
  loadSyncStatus();
  (async () => { const st = await api('job_status'); if (st && st.job && (st.job.status==='running'||st.job.status==='pending')) pollResync(); })();
}

let resyncPoll = null;
async function startServerResync() {
  const btn = $('#resyncbtn'), prog = $('#seedprog');
  btn.disabled = true; btn.textContent = 'Starting…';
  if (prog) { prog.style.display = 'block'; prog.textContent = 'Building client list on the server…'; }
  const r = await apiPostBody({ action: 'start_resync' });
  if (!r || !r.ok) { btn.disabled = false; btn.textContent = '↻ Re-sync all fields'; if (prog) prog.textContent = 'Could not start' + (r&&r.error?': '+r.error:'') + '.'; return; }
  pollResync();
}
async function pollResync() {
  const btn = $('#resyncbtn'), prog = $('#seedprog');
  if (resyncPoll) clearInterval(resyncPoll);
  const tick = async () => {
    const st = await api('job_status');
    const j = st && st.job;
    if (!j) { if (prog) prog.textContent = 'No active job.'; stopResync(); return; }
    const pct = j.total ? Math.round(100 * (j.processed||0) / j.total) : 0;
    if (prog) { prog.style.display='block'; prog.textContent = 'Re-syncing on server: ' + (j.processed||0) + ' / ' + j.total + ' (' + pct + '%) · ' + (j.clients_updated||0) + ' clients, ' + (j.policies_updated||0) + ' policies · safe to close this tab'; }
    if (btn) { btn.disabled = true; btn.textContent = 'Re-syncing ' + pct + '%'; }
    if (j.status === 'done') { if (prog) prog.textContent = 'Re-sync complete — ' + (j.clients_updated||0) + ' clients, ' + (j.policies_updated||0) + ' policies classified.'; stopResync(); if (btn){btn.disabled=false;btn.textContent='↻ Re-sync all fields';} render(); return; }
    // nudge the server to do another chunk (also progresses if cron is idle)
    apiPostBody({ action: 'step_resync' });
  };
  await tick();
  resyncPoll = setInterval(tick, 6000);
}
function stopResync(){ if (resyncPoll) { clearInterval(resyncPoll); resyncPoll = null; } }

async function loadSyncStatus() {
  const line = $('#syncline'); if (!line) return;
  const r = await api('sync_status');
  if (!r || !r.ok) { line.textContent = 'Sync status unavailable.'; return; }
  const rb = $('#resyncbtn');

  // A job is actively running — show live progress, disable the button
  if (r.job && (r.job.status === 'running' || r.job.status === 'pending')) {
    const j = r.job;
    const pct = j.total ? Math.round(j.processed / j.total * 1000) / 10 : 0;
    line.innerHTML = '<span style="color:var(--amber,#f5a623)">● Re-sync running</span> — <b>' + pct + '%</b> · '
      + (j.processed || 0).toLocaleString() + ' / ' + (j.total || 0).toLocaleString() + ' clients · '
      + (j.policies_updated || 0).toLocaleString() + ' policies updated'
      + '<div style="height:7px;background:var(--navy);border-radius:5px;overflow:hidden;margin-top:5px;max-width:420px"><div style="height:100%;width:' + pct + '%;background:var(--amber,#f5a623);transition:width .4s"></div></div>';
    if (rb) { rb.disabled = true; rb.textContent = 'Re-sync in progress…'; rb.style.opacity = '0.5'; rb.style.cursor = 'not-allowed'; }
    // auto-refresh the status every 5s while running
    clearTimeout(window._syncStatusT);
    window._syncStatusT = setTimeout(loadSyncStatus, 5000);
    return;
  }

  // No job running — show last completed + normal button
  if (rb) { rb.disabled = false; rb.textContent = '↻ Re-sync all fields'; rb.style.opacity = '1'; rb.style.cursor = 'pointer'; }
  let parts = [];
  if (r.last_complete) {
    const t = new Date(r.last_complete.updated_at);
    const mins = Math.round((Date.now() - t.getTime()) / 60000);
    const ago = mins < 1 ? 'just now' : mins < 60 ? mins + ' min ago' : mins < 1440 ? Math.round(mins/60) + ' hr ago' : Math.round(mins/1440) + ' days ago';
    parts.push('Last full re-sync: <b>' + ago + '</b> (' + (r.last_complete.processed || 0).toLocaleString() + ' clients)');
  }
  if (r.state && r.state.last_sync) {
    const t2 = new Date(r.state.last_sync);
    const m2 = Math.round((Date.now() - t2.getTime()) / 60000);
    const ago2 = m2 < 1 ? 'just now' : m2 < 60 ? m2 + ' min ago' : Math.round(m2/60) + ' hr ago';
    parts.push('nightly sync ' + ago2);
  }
  line.innerHTML = (parts.length ? parts.join(' · ') : 'No sync recorded yet') + ' · <span class="muted">live refresh when you open a client</span>';
}

async function apiPostBody(payload) {
  try {
    const r = await fetch('/api/platform', { method: 'POST',
      headers: { 'x-id-token': TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify(payload) });
    return await r.json();
  } catch { return null; }
}

async function seedAll(force) {
  const btn = force ? $('#resyncbtn') : $('#seedbtn'), prog = $('#seedprog');
  btn.disabled = true; btn.textContent = 'Fetching client list…';
  prog.style.display = 'block'; prog.textContent = 'Asking HawkSoft for all client IDs…';
  const idsRes = await apiPostBody({ action: 'seed_ids', force: !!force });
  if (!idsRes || !idsRes.ok) { prog.textContent = 'Could not fetch client IDs' + (idsRes && idsRes.error ? ': ' + idsRes.error : '') + '.'; btn.disabled = false; btn.textContent = force ? '↻ Re-sync all fields' : '⇊ Full seed'; return; }
  const ids = idsRes.ids || [];
  if (idsRes.already) prog.textContent = idsRes.already + ' clients already in — resuming with the remaining ' + ids.length + '.';
  if (!ids.length) { prog.textContent = 'All ' + (idsRes.total || idsRes.already) + ' clients are already seeded. Nothing to do.'; btn.disabled = false; btn.textContent = force ? '↻ Re-sync all fields' : '⇊ Full seed'; return; }
  let done = 0, clients = 0, pols = 0;
  for (let i = 0; i < ids.length; i += 25) {
    const batch = ids.slice(i, i + 25);
    btn.textContent = 'Seeding… ' + Math.round(100 * i / ids.length) + '%';
    prog.textContent = 'Seeding clients ' + (i + 1) + '–' + Math.min(i + 25, ids.length) + ' of ' + ids.length + ' — ' + clients + ' saved, ' + pols + ' policies so far';
    const r = await apiPostBody({ action: 'seed_batch', ids: batch });
    if (r && r.error === 'Not authorized') {
      prog.textContent = '⚠ Session expired at ' + clients + ' clients saved. Refresh the page, sign in again, and press Seed — it resumes where it stopped.';
      btn.textContent = force ? '↻ Re-sync all fields' : '⇊ Full seed'; btn.disabled = false; return;
    }
    if (r && r.ok) { clients += r.upserted; pols += r.policies; }
    done = i + batch.length;
  }
  prog.textContent = 'Done — ' + clients + ' clients and ' + pols + ' policies seeded from HawkSoft (' + done + ' IDs processed).';
  btn.textContent = force ? '↻ Re-sync all fields' : '⇊ Full seed'; btn.disabled = false;
  OPEN_CLIENT = null; render();
}

const SECTION_STATE = {}; // remembers expand/collapse across clients
function section(key, title, count, bodyHtml, opts) {
  opts = opts || {};
  const empty = !count;
  // default: insurance open, others collapsed; empty auto-collapsed; remember overrides
  let open = SECTION_STATE[key];
  if (open === undefined) open = opts.defaultOpen && !empty;
  const chevron = open ? '▾' : '▸';
  const dim = empty ? 'opacity:.5' : '';
  return '<div class="sec" style="' + dim + '">'
    + '<div class="sechead" data-sec="' + key + '" onclick="toggleSection(\'' + key + '\')" style="cursor:pointer;display:flex;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line)">'
    + '<span class="chev" style="color:var(--mute);width:14px">' + chevron + '</span>'

function toggleSection(key) {
  const head = document.querySelector('[data-sec="' + key + '"]');
  if (!head) return;
  const body = head.nextElementSibling;
  const chev = head.querySelector('.chev');
  const open = body.style.display === 'none';
  body.style.display = open ? '' : 'none';
  if (chev) chev.textContent = open ? '▾' : '▸';
  SECTION_STATE[key] = open; // remember for next client
}

async function renderOurClient(el, no, _bg) {
  const r = await api('our_client&no=' + no + (_bg ? '&refresh=1' : ''));
  if (!r || !r.ok || !r.client) { el.innerHTML = '<div class="err">Client load failed.</div>'; return; }
  const c = r.client;
  const name = c.business_name || [c.first_name, c.last_name].filter(Boolean).join(' ') || '(no name)';
  const today = new Date().toISOString().slice(0,10);

  const all = r.policies || [];
  const insurance = all.filter(p => (p.record_type || 'insurance') === 'insurance');
  let dmv = all.filter(p => p.record_type === 'dmv_service');
  // latest DMV per client = max expiration_date; drives the registration reminder
  if (dmv.length) {
    dmv = dmv.slice().sort((a,b) => String(b.expiration_date||'').localeCompare(String(a.expiration_date||'')));
    dmv[0]._latest = true;
  }
  const dmvLatest = dmv[0];
  let dmvReminder = '';
  if (dmvLatest && dmvLatest.expiration_date) {
    const d = Math.round((new Date(dmvLatest.expiration_date) - new Date())/86400000);
    if (d >= 0 && d <= 30) dmvReminder = '<span class="pill a">DMV renewal in ' + d + 'd</span>';
  }
  const other = all.filter(p => p.record_type === 'unknown');
  const inforce = insurance.filter(p => { const st=String(p.status||'').toLowerCase(); return p.expiration_date && p.expiration_date>=today && !['cancelled','canceled','expired'].includes(st); }).length;

  // ---- Summary bar (always visible) ----
  let h = '<span class="raw-t" onclick="closeClient()" style="margin:0 0 10px;display:inline-block">← ' + (OPEN_FROM ? 'Back to ' + esc(TAB_LABEL(OPEN_FROM)) : 'All clients') + '</span>'
    + (r.live ? '<span class="pill g" style="float:right">● live from HawkSoft</span>' : '<span class="pill b" style="float:right;cursor:pointer" onclick="refreshClient(' + no + ')">↻ refresh from HawkSoft</span>');
  h += '<h2 style="margin:0 0 2px">' + esc(name) + ' <span class="muted" style="font-weight:400">· #' + esc(c.client_no) + '</span></h2>';
  const clientActive = String(c.status||'').toLowerCase()==='active';
  const lapsed = clientActive && insurance.length > 0 && inforce === 0;
  const prospect = insurance.length === 0 && dmv.length === 0;
  h += '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 4px">'
    + '<span class="pill ' + (clientActive?'g':'a') + '">' + esc(c.status || '—') + '</span>'
    + (lapsed ? '<span class="pill a">⚠ no in-force policies</span>' : '')
    + '<span class="muted">' + esc(c.branch || 'No branch') + '</span>'
    + (c.phone ? '<a href="tel:' + esc(c.phone) + '" style="color:var(--blue);text-decoration:none">' + esc(c.phone) + '</a>' : '')
    + (c.email ? '<a href="mailto:' + esc(c.email) + '" style="color:var(--blue);text-decoration:none">' + esc(c.email) + '</a>' : '')
    + '<span class="pill b">' + inforce + ' in-force / ' + insurance.length + ' policies</span>'
    + (dmv.length ? '<span class="pill ' + (dmvReminder?'a':'b') + '" style="background:rgba(77,124,254,.12)">' + dmv.length + ' DMV</span>' : '')
    + (dmvReminder || '')
    + '</div>';
  h += '<div class="muted" style="font-size:13px;margin-bottom:6px">' + esc([c.address1, c.city, c.state, c.zip].filter(Boolean).join(', ') || 'No address on file') + '</div>';

  // ---- Collapsible sections ----
  h += section('ins_' + no, 'Insurance policies', insurance.length, policyRows(insurance, false),
    { defaultOpen: true, emptyText: 'No insurance policies.' });
  h += section('dmv_' + no, 'DMV / Services', dmv.length, policyRows(dmv, true),
    { defaultOpen: false, emptyText: 'No DMV services.',
      note: dmvLatest && dmvLatest.expiration_date ? 'latest reg exp ' + dmvLatest.expiration_date : '' });
  if (other.length) h += section('unk_' + no, 'Unclassified', other.length, policyRows(other, false),
    { defaultOpen: false, note: 'needs review', emptyText: '' });

  // one classifier for every ledger "kind" badge: a declined charge must never read green
  const kindPill = k => {
    const t = String(k || '');
    if (/declin|fail|error|void|refund/i.test(t)) return 'r';
    if (/captured|pending/i.test(t)) return 'a';
    return t.includes('charge') ? 'g' : 'b';
  };
  const payBody = '<table><tr><th>When</th><th>Type</th><th>Amount</th><th class="hidemob">Purpose</th><th class="hidemob">Office</th><th>Ref</th></tr>'
    + (r.payments||[]).map(p => '<tr>'
      + '<td>' + esc(String(p.ts).replace('T',' ').slice(0,16)) + '</td>'
      + '<td><span class="pill ' + kindPill(p.kind) + '">' + esc(p.kind) + '</span></td>'
      + '<td class="amount">' + money(p.amount) + '</td>'
      + '<td class="hidemob">' + esc(p.purpose || '—') + '</td>'
      + '<td class="hidemob">' + esc((p.extra && p.extra.office) || '—') + '</td>'
      + '<td>' + esc(p.ref || '—') + '</td></tr>').join('') + '</table>';
  h += section('pay_' + no, 'Payments', (r.payments||[]).length, payBody,
    { defaultOpen: false, note: 'via Speedy platform', emptyText: 'No payments recorded yet.' });

  const actBody = '<table><tr><th>When</th><th>Event</th><th class="hidemob">By</th><th>Source</th></tr>'
    + (r.events||[]).map(e => '<tr>'
      + '<td>' + esc(String(e.ts).replace('T',' ').slice(0,16)) + '</td>'
      + '<td><span class="pill a">' + esc(e.kind) + '</span></td>'
      + '<td class="hidemob">' + esc(e.actor || '—') + '</td>'
      + '<td>' + esc(e.source || '—') + '</td></tr>').join('') + '</table>';
  h += section('act_' + no, 'History (audit trail)', (r.events||[]).length, actBody,
    { defaultOpen: false, emptyText: 'No activity yet.' });

  el.innerHTML = h;

  // First open (not a bg pass) and data isn't live yet -> silently refresh once from HawkSoft
  if (!_bg && !r.live && OPEN_CLIENT === no) {
    setTimeout(() => { if (OPEN_CLIENT === no) renderOurClient(el, no, true); }, 50);
  }
}

/* ---------- Pacific date helpers ----------
   TOP LEVEL, above every reader. They were declared inside the transactions renderer
   while renderAgentView - a sibling top-level function - also called PT_DAY, so the
   by-agent tab threw "PT_DAY is not defined" on every render. Measured by brace
   depth: the scope returns to 0 at line 853, between the use and the old definition.

   Declared above their first reader, not merely somewhere in the file: a const in a
   temporal dead zone reads exactly like an undefined variable (the v2.7 dead zone).

   Day arithmetic is done on the DATE ONLY - subtracting 86400000ms lands on the wrong
   day across a DST boundary; stepping a UTC calendar date cannot. */
const PT_TZ = 'America/Los_Angeles';
const _PT_D = new Intl.DateTimeFormat('en-CA', { timeZone: PT_TZ, year:'numeric', month:'2-digit', day:'2-digit' });
const _PT_T = new Intl.DateTimeFormat('en-CA', { timeZone: PT_TZ, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false });
const PT_DAY = ts => { if(!ts) return ''; const dt = new Date(ts); return isNaN(dt) ? '' : _PT_D.format(dt); };
const PT_STAMP = ts => { if(!ts) return ''; const dt = new Date(ts); return isNaN(dt) ? '' : _PT_T.format(dt).replace(',', ''); };
const PT_TODAY = () => _PT_D.format(new Date());
const PT_DAY_MINUS = (iso, n) => { const [Y,M,D] = String(iso).split('-').map(Number);
  const t = new Date(Date.UTC(Y, M-1, D)); t.setUTCDate(t.getUTCDate() - n); return t.toISOString().slice(0,10); };

    + cell('SPEEDY KEPT', money(T.speedy_kept), '#2fbf71')

function renderAgentView(r){
  const rows = r.rows || [];
  const commMap = {}; for(const c of (r.commissions||[])) commMap[c.agent_email] = Number(c.percentage);

  // group by agent
  const byAgent = {};
  for(const x of rows){
    const a = x.agent || '(unknown)';
    if(!byAgent[a]) byAgent[a] = { agent:a, tx:[], fees:0, earned:0, pending:0, first:null, last:null };
    const g = byAgent[a];
    g.tx.push(x);
    g.fees += (x.fee||0);
    /* EARNED means RELEASED. Commission accrues in proportion to what has actually
       been COLLECTED (Tony's partial-payment rule), and the per-payment rows already
       show that correctly — releasedNote prints "$1.78 released" under the $2.00. This
       total summed the FULL commission, so an agent's by-agent figure counted money
       that has not been released yet. Cents today; it matters the moment someone reads
       this column as a payout. The unreleased remainder goes to `pending`, where the
       waiting-on-the-balance money already lives. */
    if(x.commission!=null){
      const ratio = x.collected_ratio != null ? Number(x.collected_ratio) : 1;
      g.earned  += x.commission * ratio;
      g.pending += x.commission * (1 - ratio);
    }
    else if(x.fee!=null) g.pending += x.fee*x.pct/100;
    const d = PT_DAY(x.ts);
    if(d){ if(!g.first || d<g.first) g.first=d; if(!g.last || d>g.last) g.last=d; }
  }
  const list = Object.values(byAgent).sort((a,b)=> b.earned - a.earned || b.fees - a.fees);
  /* The order control lives on BOTH sub-views. It was only ever rendered on
     Transactions, so switching to By agent silently dropped it. */
  const agSort = '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px">'
    + '<span class="muted" style="font-size:12px;margin-right:2px">Order</span>'
    + '<span class="perchip'+(AUDIT_SORT==='action'?' sel':'')+'" onclick="setAuditSort(\'action\')">Needs action first</span>'
    + '<span class="perchip'+(AUDIT_SORT==='date'?' sel':'')+'" onclick="setAuditSort(\'date\')">By date</span>'
    + '</div>';
  const totEarned = list.reduce((a,x)=>a+x.earned,0);

  let h = '<div class="muted" style="font-size:12.5px;margin:-4px 0 10px">Commission is earned only when a transaction'+"'"+'s audit is complete. Edit each agent'+"'"+'s rate; totals recalc live. Paid end of month with salary.</div>';
  h += '<div style="margin-bottom:14px;font-size:14px">Total earned commission: <b class="amount" style="color:#7fa8ff">'+money(totEarned)+'</b></div>';
  h += agSort;

  if(!list.length) h += '<div class="muted">No agent activity.</div>';

  for(const g of list){
    const isEmail = g.agent.includes('@');
    const pct = commMap[g.agent] != null ? commMap[g.agent] : 10;
    const open = AGENT_OPEN === g.agent;
    const period = (g.first && g.last) ? (g.first===g.last ? g.first : g.first+' → '+g.last) : '—';

    // header card — the flat list gave no sense of who is carrying the work, so each
    // agent now shows an initials badge and how much of their book is actually audited
    const done = g.tx.filter(x => x.audit_status === 'complete').length;
    const pctDone = g.tx.length ? Math.round(done / g.tx.length * 100) : 0;
    const nm = (AGENT_LABEL[g.agent] || g.agent);
    const initials = nm.split(/[\s@.]+/).filter(Boolean).slice(0,2).map(x => x[0].toUpperCase()).join('');
    const hue = [...g.agent].reduce((a,c) => a + c.charCodeAt(0), 0) % 360;
    h += '<div class="agentcard">';
    h += '<div onclick="toggleAgent(\''+g.agent+'\')" style="cursor:pointer;display:flex;align-items:center;gap:13px;padding:13px 16px;background:var(--navy)">'
      + '<span style="color:var(--mute);width:10px;font-size:11px">'+(open?'▾':'▸')+'</span>'
      + '<span class="avatar" style="background:hsl('+hue+',55%,68%)">'+esc(initials)+'</span>'
      + '<div style="flex:1"><b style="font-size:15px">'+esc(agentName(g.agent))+'</b>'
      + (g.agent==='info@speedyins.com'?' <span class="pill a" style="font-size:10px">admin</span>':'')
      + '<div class="muted" style="font-size:11.5px;margin-top:2px">'+g.tx.length+' payments · '+esc(period)+'</div>'
      + '<div style="display:flex;align-items:center;gap:7px;margin-top:6px">'
      + '<div style="flex:1;max-width:150px;height:4px;background:rgba(255,255,255,.09);border-radius:99px;overflow:hidden">'
      + '<div style="width:'+pctDone+'%;height:100%;background:'+(pctDone===100?'var(--green)':pctDone>=50?'#7fa8ff':'var(--amber)')+'"></div></div>'
      + '<span class="muted" style="font-size:10.5px">'+done+' of '+g.tx.length+' audited</span></div>'
      + '</div>'
      + '<div style="text-align:right"><div class="muted" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.04em">Earned</div>'
      + '<b class="amount" style="color:#7fa8ff;font-size:17px">'+money(g.earned)+'</b></div>'
      + '<div style="text-align:right;min-width:74px"><div class="muted" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.04em">Pending</div>'
      + '<span class="amount" style="color:'+(g.pending>0?'var(--amber)':'var(--mute)')+'">'+money(g.pending)+'</span></div>'
      + '</div>';

    if(open){
      // rate editor + breakdown
      h += '<div style="padding:12px 16px;border-top:1px solid var(--line);background:rgba(255,255,255,.02)">';
      if(isEmail){
        h += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px">'

          + '<span class="muted">% of fee · fees generated: <b class="amount">'+money(g.fees)+'</b></span></div>';
      }
      h += '<table><tr><th>When</th><th>Client</th><th>Path</th><th>Charge</th><th>Fee</th><th>Comm.</th><th>Status</th><th class="docs">Docs</th></tr>';
      const atts = r.attachments || [];
      /* THE SAME ORDER AS THE TRANSACTIONS VIEW. An agent opening their own row is
         looking for what they still have to do; date order buries it. Melisa's three
         unfinished audits sat below finished ones. Honours the same AUDIT_SORT
         control, so the two views cannot disagree. */
      /* Same test as the badge and as the transactions view - a carrier receipt, not
         merely any document. */
      const agHasReceipt = z => atts.some(a => a.payment_id === z.id
        && (String(a.doc_type || a.kind || '') === 'carrier_receipt'
            || String(a.doc_type || '').endsWith('_no_payment')));
      const agOpen = z => z.audit_status !== 'complete' && !z.pre_audit;
      const agNeedsProof = z => agOpen(z) && !agHasReceipt(z);
      const agNeedsCost  = z => agOpen(z) &&  agHasReceipt(z) && (z.service_cost == null);
      const agBucket = z => agNeedsProof(z) ? 0 : (agNeedsCost(z) ? 1 : 2);
      const txList = (AUDIT_SORT === 'action')
        ? g.tx.slice().sort((p,q) => (agBucket(p) - agBucket(q))
                                     || String(q.ts).localeCompare(String(p.ts)))
        : g.tx;
      for(const x of txList){
        const st = x.pre_audit ? '<span class="muted">—</span>' : x.audit_status==='complete' ? '<span class="pill g">complete</span>' : '<span class="pill a">'+esc(String(x.audit_status||'open').replace(/_/g,' '))+'</span>';
        const docs = atts.filter(a => (a.payment_id===x.id) || (a.client_no===x.client_no));
        const docCell = docsCell(docs, !x.pre_audit && x.audit_status !== 'complete', x.id, (x.client_name||('#'+x.client_no))+' \u00b7 '+money(x.amount));
        h += '<tr><td class="muted" style="font-size:12px">'+esc(PT_DAY(x.ts))+'</td>'
          + '<td><span class="raw-t" onclick="openClient('+x.client_no+')">'+(x.client_name?esc(x.client_name)+' ':'')+'#'+x.client_no+'</span>'
            + (x.charged_by_other ? '<div class="muted" style="font-size:10.5px">charged by ' + esc(String(x.charged_by||'').split(' ')[0]) + '</div>' : '')
            + '</td>'
          + '<td><span class="pill b">'+(x.path==='dmv_service'?'DMV':x.path==='insurance'?'Insurance':esc(x.path||'—'))+'</span></td>'
          + '<td class="amount">'+money(x.amount)+balanceCell(x)+'</td>'
          + '<td class="amount">'+(x.fee!=null?money(x.fee):'—')+'</td>'
          + '<td class="amount">'+(x.commission!=null?'<b style="color:#7fa8ff">'+money(x.commission)+'</b>':(x.fee!=null?'<span class="muted">'+money(x.fee*x.pct/100)+'?</span>':'—'))+releasedNote(x)+'</td>'
          + '<td>'+st+'</td><td class="docs">'+docCell+'</td></tr>';
      }
      h += '</table></div>';
    }
    h += '</div>';
  }
  return h;
