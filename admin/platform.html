/* ---------- ONE ROW, TWO VIEWS (Sep 13) ----------
   Saif: "when I click By agent I don't see all the same information." The by-agent
   view had its own, older row: no Cost, no purpose, no time, raw status text, no
   "+ proof", and it would never have shown "waiting for you" or "sent back". Same
   bug shape MASTER.md already names - fix one reader, leave the other. Now both views
   build every row through auditRowHtml with the same header, so they cannot differ.
   ctx = { atts, canApprove, email, names }. */
function auditRowKit(ctx){
  const pathLabel = p => p==='dmv_service' ? 'DMV service' : p==='insurance' ? 'Insurance' : p==='pre_audit' ? 'Pre-audit' : (p||'—');
  const statusPill = row => {
    if(row.pre_audit) return '<span class="muted" title="Charged before the proof-of-payment process">—</span>';
    const s = row.audit_status;
    if(s==='complete') return '<span class="pill g">complete</span>';
    /* "waiting for YOU" only if this signed-in person can approve; otherwise it is
       waiting for someone else and the pill must not read as a to-do. */
    if(s==='ready_for_audit') return '<span class="pill b">' + (ctx.canApprove ? 'waiting for you' : 'waiting for approval') + '</span>';
    if(row.audit_sendback) return '<span class="pill r">sent back</span>';
    if(s==='carrier_pending') return '<span class="pill a">docs pending</span>';
    return '<span class="pill a">needs audit</span>';
  };
  /* THE LINE UNDER THE PILL: who did what, when, and the reason. Read from the row,
     never inferred - a "complete" with no submitter was approved by the agent
     themselves before Sep 12 and the line says nothing rather than something false. */
  const nameOf = e => (ctx.names && ctx.names[e]) || (e ? String(e).split('@')[0] : '');
  const first = e => String(nameOf(e)).split(' ')[0];
  const agoOf = ts => { const m = Math.round((Date.now() - new Date(ts)) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m/60) + ' h ago' : Math.round(m/1440) + ' d ago'; };
  const reviewSub = row => {
    const sb = row.audit_sendback;
    if(row.audit_status === 'ready_for_audit'){
      return '<div class="rvsub">submitted' + (row.audit_submitted_by ? ' by ' + esc(first(row.audit_submitted_by)) : '')
        + (row.audit_submitted_at ? ' · ' + esc(agoOf(row.audit_submitted_at)) : '')
        + (row.fee_only ? ' · <span class="fee">fee only — no carrier payment</span>' : '')
        + (sb ? ' · <span class="re">resubmitted after send-back</span>' : '')
        /* the agent's reply - the first line of it; the room has the whole thing */
        + (sb && sb.reply ? '<span class="reply"><b>' + esc(first(row.audit_submitted_by || row.commission_to || row.agent)) + ' replied:</b> “' + esc(snip(sb.reply)) + '” ' + openReview(row) + '</span>' : '')
        /* the note written at submission (Saif, Sep 14) */
        + (row.audit_note ? '<span class="reply note"><b>' + esc(first(row.audit_submitted_by || row.commission_to || row.agent)) + ':</b> “' + esc(snip(row.audit_note)) + '” ' + (row.audit_note.length > SNIP ? openReview(row) : '') + '</span>' : '')
        + '</div>';
    }
    if(row.audit_status === 'complete'){
      if(!row.audit_submitted_at) return '';
      return '<div class="rvsub">approved by ' + esc(first(row.audit_completed_by)) + (row.audit_completed_at ? ' · ' + esc(PT_STAMP(row.audit_completed_at)) : '')
        + (sb ? ' · after a send-back' : '') + '</div>';
    }
    if(sb){
      return '<div class="rvsub">sent back by ' + esc(first(sb.by)) + (sb.at ? ' · ' + esc(PT_STAMP(sb.at)) : '')
        + ' · <i>' + esc(SENDBACK_CODES[sb.code] || 'needs a fix') + (sb.reason ? ' — ' + esc(snip(sb.reason)) : '') + '</i>'
        + (sb.reason && sb.reason.length > SNIP ? ' ' + openReview(row) : '')
        + '<br>' + esc(first(row.commission_to || row.agent)) + ' notified · not resubmitted yet</div>';
    }
    return '';
  };
  /* A paragraph does not belong on a row. The row shows the first line; the whole
     exchange, readable, is in the review room. */
  const SNIP = 110;
  const snip = t => { t = String(t || '').replace(/\s+/g, ' ').trim(); return t.length > SNIP ? t.slice(0, SNIP).replace(/\s+\S*$/, '') + '…' : t; };
  const openReview = row => '<span class="more" onclick="openDocs(\'' + row.id + '\')">Open review ▸</span>';
  const reviewActs = row => {
    if(!ctx.canApprove || row.audit_status !== 'ready_for_audit') return '';
    const own = (row.commission_to || row.agent || '') === (ctx.email || '') || (row.audit_submitted_by || '') === (ctx.email || '');
    if(own) return '<div class="rvsub">yours — someone else approves it</div>';
    return '<div class="rvacts"><button class="aok" onclick="approveAudit(\'' + row.id + '\')">Approve</button>'
      + '<button class="ano" onclick="openSendBack(\'' + row.id + '\')">Send back…</button></div>'
      + '<div class="rvmsg" id="rvmsg_' + row.id + '"></div>';
  };
  return { pathLabel, statusPill, nameOf, first, agoOf, reviewSub, reviewActs };
}

async function drawAudit(el, r){
  if(AUDIT_SUB === 'fees'){
    try { el.innerHTML = (await renderCorrections()) + '<h2>Audit — fees by agent</h2>' + auditSubNav() + renderFeesView(r); }
    catch(e){ el.innerHTML = auditSubNav() + '<div class="err">Fees render error: ' + esc(String(e&&e.message||e)) + '</div>'; }
    return;
  }
  if(AUDIT_SUB === 'agents'){
    try { el.innerHTML = (await renderCorrections()) + '<h2>Audit — commission by agent</h2>' + auditSubNav() + renderAgentView(r); }
    catch(e){ el.innerHTML = auditSubNav() + '<div class="err">By-agent render error: ' + esc(String(e&&e.message||e)) + '</div>'; }
    return;
  }
  const q = String(AUDIT_Q || '').trim().toLowerCase();
  const rows = (r.rows || []).filter(x => auditRowMatches(x, q));
  const atts = r.attachments || [];
  window.AUDIT_ROWS = {}; (r.rows || []).forEach(x => window.AUDIT_ROWS[x.id] = x);
  const canApprove = !!r.can_approve;
  /* Ticks on rows that are no longer waiting (approved meanwhile, or sent back) drop out. */
  for(const id of [...AUDIT_SEL]) if(!(AUDIT_ROWS[id] && AUDIT_ROWS[id].audit_status === 'ready_for_audit')) AUDIT_SEL.delete(id);

  const K = auditRowKit({ names: r.names, email: r.email, canApprove, atts });
  const first = K.first;
  const ctx0 = { atts, canApprove, email: r.email, names: r.names, kit: K };

  /* ------------------------------------------------------------------
     PACIFIC TIME, ALWAYS. The agency is in Los Angeles; this console ran
     on UTC. toISOString() is UTC, so from 5pm PT onward "today" had
     already rolled over to tomorrow and the Audit tab showed 0 rows for
     the last two hours of the business day and all evening.

     America/Los_Angeles is named explicitly rather than using the
     browser's local zone, so the numbers are identical whoever opens it
     and from wherever. en-CA formats as YYYY-MM-DD, so every existing
     string comparison keeps working unchanged. Intl handles DST.

     Declared ABOVE inPeriod, its first reader (see: the v2.7 dead zone).
     ------------------------------------------------------------------ */
  /* The Pacific helpers now live at TOP LEVEL, above renderAgentView - see there.
     They used to be declared here, inside this renderer, and the by-agent view is a
     SEPARATE top-level function, so PT_DAY was never visible to it: "By-agent render
     error: PT_DAY is not defined". */

  // Date filter — "Total fees" with no period read like a business number when it was
  // really "everything ever recorded". Totals below are always for the selected period.
  const inPeriod = auditInPeriod;   // one test for the three views (Sep 17)
  const allRows = rows;
  let periodRows = allRows.filter(x => inPeriod(x.ts));

  /* ---------- Sort by WHAT IS MISSING, not by date ----------
     Melisa left three audits at carrier_pending on Sep 3 and lost track of ~$45 of
     her own commission, because a half-finished audit looks identical to a finished
     one in a list ordered by date. The two unfinished states need different actions,
     so they are separate buckets rather than one "needs attention":
       1. no carrier cost - the receipt is there, a NUMBER is missing
       2. no proof        - nothing uploaded at all
     Newest first inside each bucket. Date order remains available. */
  /* The bucket test must be the SAME test as the badge, or the order contradicts the
     colours. doc_count counts ANY document - a client receipt is not proof of what was
     paid to the carrier - so a row showing "1 file · no receipt" was landing in the
     carrier-cost bucket and mixing with rows that genuinely had their receipt. */
  const hasReceipt = x => !!x.fee_only || atts.some(a => a.payment_id === x.id && isProofDoc(a));
  const open_ = x => x.audit_status !== 'complete' && x.audit_status !== 'pre_audit';
  const waiting = x => x.audit_status === 'ready_for_audit';
  const sentBack = x => open_(x) && !waiting(x) && !!x.audit_sendback;
  const needsProof = x => open_(x) && !waiting(x) && !hasReceipt(x);
  const needsCost  = x => open_(x) && !waiting(x) && hasReceipt(x) && (x.service_cost == null);
  const bucket = x => needsProof(x) ? 0 : (needsCost(x) ? 1 : 2);
  /* The approver's queue comes first by default, the moment there is one. Chosen
     order is respected once they pick. */
  const nWait = periodRows.filter(waiting).length;
  if(canApprove && nWait && !AUDIT_SORT_CHOSEN) AUDIT_SORT = 'waiting';
  if(AUDIT_SORT === 'waiting'){
    periodRows = periodRows.slice().sort((a,b) =>
      ((waiting(a) ? 0 : 1) - (waiting(b) ? 0 : 1)) || (bucket(a) - bucket(b)) || String(b.ts).localeCompare(String(a.ts)));
  } else if(AUDIT_SORT === 'action'){
    periodRows = periodRows.slice().sort((a,b) =>
      (bucket(a) - bucket(b)) || String(b.ts).localeCompare(String(a.ts)));
  }
  const nProof = periodRows.filter(needsProof).length;
  const nCost  = periodRows.filter(needsCost).length;
  const nBack  = periodRows.filter(sentBack).length;

  const totFees = periodRows.reduce((a,x)=> a + (x.fee||0), 0);
  const totComm = periodRows.reduce((a,x)=> a + (x.commission||0), 0);
  const auditedCount = periodRows.filter(x => x.audit_status === 'complete').length;

  /* the head is drawn once and left alone: the search box lives in it */
  const head = '<h2>Audit — full transaction trail</h2>' + auditSubNav()
    + '<div class="muted" style="font-size:13px;margin:-4px 0 12px">Each charge with its proof of payment (carrier or DMV) and required documents. The agent submits; commission is earned the day it is approved here.</div>'
    + '<input id="auditSearch" placeholder="Search client name, #, transaction ref, agent, purpose…" value="'+esc(AUDIT_Q)+'" '
    + 'style="width:100%;max-width:520px;background:var(--navy);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--ink);font-size:14px;margin-bottom:12px">';
  let h = '';

  h += periodChipsHtml();
  const schip = (k,label,count,colour) =>
    '<span class="perchip'+(AUDIT_SORT===k?' sel':'')+'" onclick="setAuditSort(\''+k+'\')">' + label
    + (count ? ' <b style="color:'+colour+'">'+count+'</b>' : '') + '</span>';
  h += '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px">'
    + '<span class="muted" style="font-size:13px;margin-right:2px">Order</span>'
    + (canApprove ? schip('waiting','Waiting for you', nWait, '#7fa8ff') : '')
    + schip('action','Needs action first', nProof + nCost, '#f5a623')
    + schip('date','By date', 0, '')
    + (nWait || nBack || nProof || nCost
        ? '<span class="muted" style="font-size:13px;margin-left:8px">'
          + [ nWait ? nWait + (canApprove ? ' waiting for your approval' : ' waiting for approval') : '',
              nBack ? nBack + ' sent back, not yet resubmitted' : '',
              nProof ? nProof + ' with no proof' : '',
              nCost ? nCost + ' waiting on a carrier cost' : '' ].filter(Boolean).join(' \u00b7 ')
          + '</span>'
        : '')
    + '</div>';
  /* THE BULK BAR. Approve many at once is a human decision made once per tick; send
     back stays one at a time because each needs its own reason. Shows only when the
     selection is not empty, and says what is in it in money and people. */
  h += auditBulkBarHtml(ctx0);
  h += '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:13px">'
    + '<span class="muted">'+periodRows.length+' transaction'+(periodRows.length===1?'':'s')+'</span>'
    + '<span class="muted">·</span><span>Fees '+esc(periodLabel())+': <b class="amount">'+money(totFees)+'</b></span>'
    + '<span class="muted">·</span><span>Commission earned: <b class="amount" style="color:#7fa8ff">'+money(totComm)+'</b></span>'
    + (auditedCount < periodRows.length
        ? '<span class="muted">·</span><span class="muted" title="Fees only exist once an audit is complete">'
          + auditedCount + ' of ' + periodRows.length + ' audited</span>'
        : '')
    + '</div>';
  const pendingCount = periodRows.filter(x=>x.receipt_pending).length;
  if(pendingCount){
    h += '<div style="border:1px solid #e03131;background:rgba(224,49,49,.12);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px"><b style="color:#e03131">\u26a0 '+pendingCount+' charge'+(pendingCount>1?'s':'')+' captured but receipt not completed</b> — card was charged but the receipt/HawkSoft step did not finish. These need attention.</div>';
  }

  const ctx = ctx0;
  h += '<div class="tscroll"><table>' + auditHeadHtml(ctx);
  if(!periodRows.length) h += '<tr><td colspan="' + (canApprove ? 11 : 10) + '" class="muted">No transactions in this period.</td></tr>';
  for(const row of periodRows) h += auditRowHtml(row, ctx);
  h += '</table></div>';

  // pre-audit note
  if(periodRows.some(x=>x.pre_audit)) h += '<div class="muted" style="font-size:13px;margin-top:10px">— Transactions marked "—" were charged before the proof-of-payment process began; no audit documents are required for them.</div>';

  const body = document.getElementById('auditBody');
  if(body && document.getElementById('auditSearch') && el.contains(body)){
    body.innerHTML = h;                  // a redraw: the head, and the cursor in its box, stay put
  } else {
    el.innerHTML = head + '<div id="auditBody">' + h + '</div>';
    const si = document.getElementById('auditSearch');
    if(si){
      si.oninput = () => { AUDIT_Q = si.value; clearTimeout(window._auditT); window._auditT = setTimeout(redrawAudit, 120); };
      if(AUDIT_Q){ si.focus(); si.setSelectionRange(si.value.length, si.value.length); }
    }
  }
}

function roomNav(step){
  if(!ROOM) return;
  const docs = DOC_SORTED[ROOM.rowKey] || []; if(docs.length < 2) return;
  showDoc(ROOM.rowKey, (ROOM.i + step + docs.length) % docs.length);

function roomZoom(how){
  if(!ROOM) return;
  /* 'fit' | 'one' (100%) | 'in' | 'out' - words, because +1 and 1 are the same number */
  if(how === 'fit') ROOM.zoom = 'fit';
  else if(how === 'one') ROOM.zoom = 1;
  else { const cur = ROOM.zoom === 'fit' ? 1 : ROOM.zoom; let i = ZOOMS.indexOf(cur); if(i < 0) i = 2; i = Math.max(0, Math.min(ZOOMS.length - 1, i + (how === 'in' ? 1 : -1))); ROOM.zoom = ZOOMS[i]; }
  applyView(); drawTool();
}
function roomRotate(){ if(!ROOM) return; ROOM.rot = (ROOM.rot + 90) % 360; applyView(); }
function roomExpand(){

/* zoom and rotation, applied to what is in the pane. A photo scales and turns; a PDF
   scales (its own viewer inside re-lays out to the scaled width - which is the zoom). */
function applyView(){
  const wrap = document.querySelector('#docPane .zoomwrap'); if(!wrap || !ROOM) return;
  const isImg = !!wrap.querySelector('img');
  const z = ROOM.zoom === 'fit' ? 1 : ROOM.zoom, r = isImg ? ROOM.rot : 0;
  wrap.classList.toggle('fit', ROOM.zoom === 'fit');
  if(isImg){
    wrap.style.transform = (z !== 1 ? 'scale(' + z + ')' : '') + (r ? ' rotate(' + r + 'deg)' : '');
    wrap.style.transformOrigin = r ? 'center center' : '0 0';
    wrap.style.width = ''; wrap.style.height = '';
  } else {
    const fr = wrap.querySelector('iframe');
    wrap.style.transform = z !== 1 ? 'scale(' + z + ')' : ''; wrap.style.transformOrigin = '0 0';
    wrap.style.width = z !== 1 ? (100 / z) + '%' : '';
    if(fr) fr.style.height = z !== 1 ? 'calc(' + (ROOM.full ? '(100vh - 240px)' : '520px') + ' / ' + z + ')' : '';
  }
}

async function showDoc(rowKey, i){
  const docs = DOC_SORTED[rowKey] || [];
  const d = docs[i]; if(!d) return;
  if(ROOM && ROOM.rowKey === rowKey){ ROOM.i = i; ROOM.rot = 0; ROOM.zoom = 'fit'; DOC_CUR = null; drawTool(); }   // a new file starts at Fit, upright
  document.querySelectorAll('.docitem').forEach(x => x.classList.remove('sel'));
  const li = document.getElementById('di'+i); if(li) li.classList.add('sel');
  const pane = document.getElementById('docPane');
  pane.innerHTML = '<div class="muted" style="padding:18px;font-size:13px">Loading ' + esc(d.filename||'file') + '\u2026</div>';
  const r = await api('attachment_get&id=' + encodeURIComponent(d.id));
  if(!r || !r.ok || (!r.file_b64 && !r.blob_url)){
    pane.innerHTML = '<div style="padding:18px;font-size:13px;color:#a32d2d">No file is stored for this record.</div>';
    drawTool(); return;
  }
  let url = r.blob_url;
  if(!url){
    try{
      let b64 = r.file_b64; if(b64.startsWith('data:')) b64 = b64.split(',')[1] || '';
      const bin = atob(b64), arr = new Uint8Array(bin.length);
      for(let j=0;j<bin.length;j++) arr[j] = bin.charCodeAt(j);
      url = URL.createObjectURL(new Blob([arr], { type: r.mime || 'application/pdf' }));
      DOC_URLS.push(url);
    }catch(e){
      pane.innerHTML = '<div style="padding:18px;font-size:13px;color:#a32d2d">That file could not be opened.</div>';
      return;
    }
  }
  DOC_CUR = { url, name: r.filename || d.filename || 'document.pdf', mime: r.mime || '' };
  const isImg = /^image\//.test(DOC_CUR.mime);
  pane.innerHTML = '<div class="zoomwrap fit">' + (isImg
    ? '<img src="' + url + '" alt="">'
    : '<iframe src="' + url + '"></iframe>') + '</div>';
  applyView(); drawTool();
  const note = document.getElementById('roomMsg');
  if(note && !note.textContent) note.textContent = fmtBytes(d.bytes) + (d.filed_hawksoft ? ' \u00b7 filed to HawkSoft' : ' \u00b7 not filed to HawkSoft');
}

async function viewAttachment(id){
  const r = await api('attachment_get&id='+encodeURIComponent(id));
  if(!r || !r.ok){ alert('Could not load document — no file stored for this record.'); return; }
  if(r.blob_url){ window.open(r.blob_url, '_blank'); return; }
  if(!r.file_b64){ alert('No file stored for this record.'); return; }
  try {
    // Decode base64 → Blob → object URL. Data-URIs this large fail silently in iframes;
    // a Blob URL renders reliably at any size (the 1.96MB "signed app" was opening blank before).
    let b64 = r.file_b64;
    if(b64.startsWith('data:')) b64 = b64.split(',')[1] || '';
    const bin = atob(b64);
    const len = bin.length;
    const bytes = new Uint8Array(len);
    for(let i=0;i<len;i++) bytes[i] = bin.charCodeAt(i);
    const blob = new Blob([bytes], { type: r.mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    // free the memory after the tab has had time to load it
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  } catch(e){
    alert('Could not open the document: ' + e.message);
  }
}

async function renderSystemHealth(){
  const r = await api('system_health');
  if(!r || !r.ok) return '<div class="err" style="margin-top:20px">Could not load system health.</div>';
  const mb = b => (b/1048576);
  const fmt = b => b >= 1073741824 ? (b/1073741824).toFixed(2)+' GB' : (b/1048576).toFixed(1)+' MB';
  const dbBytes = r.db_bytes||0, attBytes = r.attachments_bytes||0;
  const dbWarn = r.thresholds.db_warn, dbCrit = r.thresholds.db_crit;
  const attWarn = r.thresholds.att_warn;
  const dbPct = Math.min(100, dbBytes / (8*1073741824) * 100);   // vs 8GB Pro cap
  const attPct = Math.min(100, attBytes / attWarn * 100);         // vs 500MB warn line

  const barColor = pct => pct >= 90 ? '#e03131' : pct >= 70 ? '#f5a623' : '#2fbf71';

  let h = '<h2 style="margin-top:26px">System health</h2>';
  h += '<div class="muted" style="font-size:13px;margin:-4px 0 12px">Storage usage and capacity. Updated live · '+esc(String(r.generated_at||'').replace('T',' ').slice(0,16))+'</div>';

  // alerts
  if(r.alerts && r.alerts.length){
    for(const a of r.alerts){
      const col = a.level==='critical' ? '#e03131' : '#f5a623';
      h += '<div style="border:1px solid '+col+';background:'+col+'1a;border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:13px"><b style="color:'+col+'">'+(a.level==='critical'?'⚠ CRITICAL':'⚠ Warning')+':</b> '+esc(a.msg)+'</div>';
    }

    h += '<div style="border:1px solid var(--green,#2fbf71);background:rgba(47,191,113,.1);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px"><b style="color:#2fbf71">✓ Healthy</b> — all storage well within limits.</div>';

  // DB usage bar (vs 8GB Pro)

  h += '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>Database total</span><span><b>'+fmt(dbBytes)+'</b> <span class="muted">/ 8 GB (Pro)</span></span></div>';
  h += '<div style="height:10px;background:var(--navy);border-radius:6px;overflow:hidden"><div style="height:100%;width:'+dbPct.toFixed(1)+'%;background:'+barColor(dbPct)+'"></div></div>';
  h += '<div class="muted" style="font-size:12px;margin-top:3px">Warn at '+fmt(dbWarn)+' · plan expansion by then</div>';
  h += '</div>';

  // Attachments usage bar (vs 500MB warn)
  h += '<div style="margin-bottom:18px">';
  h += '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>Inline attachments ('+(r.attachment_count||0)+' files)</span><span><b>'+fmt(attBytes)+'</b> <span class="muted">/ 500 MB (move-to-Blob line)</span></span></div>';
  h += '<div style="height:10px;background:var(--navy);border-radius:6px;overflow:hidden"><div style="height:100%;width:'+attPct.toFixed(1)+'%;background:'+barColor(attPct)+'"></div></div>';
  h += '<div class="muted" style="font-size:12px;margin-top:3px">Receipt/doc PDFs stored in DB. Past 500 MB, move to Blob storage.</div>';
  h += '</div>';

  // per-table breakdown
  h += '<table><tr><th>Table</th><th>Size</th><th>Rows</th><th class="hidemob">Dead rows</th></tr>';
  for(const t of (r.tables||[])){

/* ---------- Item 70 step 4 · STAFF & PERMISSIONS ----------
   REBUILT after Saif called the first version old-fashioned, and he was right: 18 people
   x a 155px card with seven checkboxes was ~2,800px of page, 126 boxes with 112 of them
   empty, and a "Why?" field plus a Save button on every row when nothing had changed. It
   gave the NORM (no extras — 16 of 18 people) the same weight as the EXCEPTION (a grant).

   Now: one scannable line per person, grouped by role, editor opening on click. The
   reason box and Save appear only when something has ACTUALLY changed, and they name the
   change. The tick-boxes and roles still come from the SERVER, never a list hardcoded
   here — a page with its own copy of the capabilities drifts the moment one is added. */
/* ⚠ apiPostBody, NOT apiPost. This file has BOTH, with different signatures:
   apiPost(action) takes a STRING and wraps it as {action}; apiPostBody(payload) sends
   the object as-is. portal.html's apiPost takes the OBJECT, and copying that pattern
   here sent {action:{action:'save_agent',...}} - body.action would have been an object,
   no handler would match, and Save would have silently done nothing. Caught by the
   harness asserting on the POST body. Same name, two files, two meanings: item 22. */
let STAFF_DATA = null, STAFF_OPEN = null, STAFF_Q = '', STAFF_FILTER = 'all';

/* ELEMENT IDS ARE ROW INDICES, NOT EMAILS, AND ARE LOOKED UP WITH getElementById.
   The version that shipped built ids out of the address and read them back with
   querySelector: '#srole_tony@speedyins.com' is not a valid CSS selector - '@' is not
   an identifier character and '.' starts a class - so querySelector THREW on every
   edit. The row opened, and then changing the role, a tick or the switch did nothing
   at all. Proved in jsdom, not assumed:
     querySelector('#srole_tony@speedyins.com') -> SyntaxError: Invalid selector
     getElementById('srole_tony@speedyins.com') -> found
   My harness passed 39/39 through it because its stub $ was a plain map lookup that
   cannot throw. An index is an integer: safe inside an attribute, safe in a selector,
   and unique where a slug of the address would collide (a.b@ and a_b@ slug the same). */
const byId = i => document.getElementById(i);
const staffAt = i => (STAFF_DATA && STAFF_DATA.rows) ? STAFF_DATA.rows[Number(i)] : null;

const CAP_LABEL = { refund:'Refunds', approve_month:'Approve the month',
  audit_approve:'Approve audits', correct:'Corrections', manage_agents:'Manage staff',
  commission_override:'Override commission', console:'Console access',
  sms_all:'See every text', sms_private:'Texts stay private' };
const capLabel = c => CAP_LABEL[c] || c;

/* ONE SENTENCE PER PERMISSION, in the language of what it lets someone DO to money or
   to paperwork - not the name of the flag. Saif, Sep 10: "when hover on the refund for
   example explain what is this for?". The same string feeds the hover tooltip, the
   title attribute and the tap-friendly list, so there is one place to correct it. */
const CAP_HELP = {
  refund: 'Sends money back to a client on a payment Speedy already took. The money '
    + 'leaves the account, so a reason is recorded every time.',
  audit_approve: 'Confirms the carrier paperwork on a charge is right. This is the step '
    + 'that releases the agent’s commission, so it decides who gets paid.',
  correct: 'Fixes a wrong amount, client or carrier on a payment that has already been '
    + 'taken. The original stays visible — nothing is overwritten.',
  approve_month: 'Finalises what every agent is paid for that month. Once a month is '
    + 'closed it can never move, so this is the last word on a payroll figure.',
  commission_override: 'Changes what one agent earns on one payment, away from the '
    + 'normal split. Always needs a reason.',
  manage_agents: 'This page. Add people, change roles, switch sign-in off, and hand out '
    + 'any of the permissions on this list.',
  console: 'Opens this admin console at all. Without it they only see the agent portal '
    + 'where charges are taken.',
  sms_all: 'In the Inbox, sees the texts on every agent’s direct number in every office, '
    + 'and can whisper on them. Without it an agent sees the branch lines plus the '
    + 'direct numbers of their own office.',
  sms_private: 'The texts on this person’s own direct number are shown only to them and '
    + 'to owners and admins — not to the rest of their office.',
};
const capHelp = c => CAP_HELP[c] || 'No description recorded for this permission yet.';

async function renderStaff(el) {

  if (!r.ok) { el.innerHTML = '<h2>Staff &amp; permissions</h2><div class="err">' + esc(r.error || 'Not permitted') + '</div>'; return; }
  STAFF_DATA = r;
  /* A fresh load is a fresh list. Without this, leaving the tab with a row open and
     coming back showed that row still expanded, with half-edited fields that no longer
     matched the reloaded data — and a diff computed against the OLD row. */
  STAFF_OPEN = null;
  el.innerHTML = staffHtml();

/* What this person would BECOME if Save were pressed now, and what that changes from the
   loaded state. The diff is what the reason is for: "why does Yasmin have refunds" is
   only answerable if the change was named at the time it was made. */
function staffPending(i) {
  const a = staffAt(i), r = STAFF_DATA;
  if (!a) return { changed: [] };
  const val = (k, dflt) => { const e = byId(k + '_' + i); return e ? e.value : dflt; };
  const role = val('srole', a.role);
  const actBox = byId('sact_' + i);
  const active = actBox ? !!actBox.checked : a.active;
  const full_name = String(val('snm', a.full_name || '')).trim();
  const branch = String(val('sbr', a.branch || '')).trim();
  const producer_code = String(val('spc', a.producer_code || '')).trim().toUpperCase();
  const notes = String(val('snote', a.notes || '')).trim();
  const roleCaps = (r.role_caps && r.role_caps[role]) || [];
  const grants = (r.grantable || []).filter(c => {
    if (roleCaps.includes(c)) return false;        // implied by the role, not a grant
    const b = byId('sg_' + i + '_' + c);
    return b ? b.checked : a.grants.includes(c);
  });
  const changed = [];
  const was = (k, v) => String(a[k] || '') !== String(v);
  if (was('full_name', full_name)) changed.push('name → ' + (full_name || '(blank)'));
  if (was('branch', branch)) changed.push('branch → ' + (branch || 'no branch'));
  if (was('producer_code', producer_code)) changed.push('producer code → ' + (producer_code || '(blank)'));
  if (role !== a.role) changed.push('role → ' + role);
  if (active !== a.active) changed.push(active ? 'can sign in' : 'cannot sign in');
  if (was('notes', notes)) changed.push('note edited');
  for (const c of grants) if (!a.grants.includes(c)) changed.push('+ ' + capLabel(c));
  for (const c of a.grants) if (!grants.includes(c)) changed.push('− ' + capLabel(c));
  return { role, active, grants, full_name, branch, producer_code, notes, changed };
}

function staffMatches(a) {
  if (STAFF_FILTER === 'owners' && a.role === 'agent') return false;
  if (STAFF_FILTER === 'extras' && !a.grants.length) return false;
  if (STAFF_FILTER === 'off' && a.active) return false;
  if (!STAFF_Q) return true;
  const q = STAFF_Q.toLowerCase();
  return (a.full_name || '').toLowerCase().includes(q)
      || a.email.toLowerCase().includes(q)
      || (a.branch || '').toLowerCase().includes(q)
      || (a.producer_code || '').toLowerCase().includes(q);
}

function staffRowHtml(a) {
  const r = STAFF_DATA, i = a._i, open = STAFF_OPEN === i, isMe = a.email === r.me;
  const roleCaps = (r.role_caps && r.role_caps[a.role]) || [];
  /* The SUMMARY is the point of the redesign: "everything" when the role has it all,
     the actual grant names when there are some, a quiet "no extras" otherwise — instead
     of seven empty checkboxes repeated eighteen times. */
  /* "everything" = every permission any ROLE carries. A grant-only pill (sms_private,
     in no bundle by design) must not stop an owner reading as "everything". */
  const bundled = new Set(Object.values(r.role_caps || {}).flat());
  const summary = roleCaps.length >= (r.grantable || []).filter(c => bundled.has(c)).length
    ? '<span class="sp all">everything</span>'
    : (a.grants.length ? a.grants.map(c => '<span class="sp">' + esc(capLabel(c)) + '</span>').join('')

  const roleChip = '<div class="srole ' + esc(a.role) + '">' + esc(a.role) + '</div>';
  const branchCell = '<div class="smeta">' + esc(a.branch || 'no branch') + '</div>';

  let h = '<div class="srow' + (open ? ' open' : '') + (a.active ? '' : ' off')
    /* SINGLE quotes inside the double-quoted attribute, and an integer rather than an
       address. JSON.stringify emits DOUBLE quotes, which terminate the attribute:
       onclick="staffToggle("a@b.com")" leaves the handler as `staffToggle(` and the
       whole page becomes unclickable. Saif found that in thirty seconds; the harness
       missed it because it called staffToggle() directly, never through the markup. */
    + '" onclick="staffToggle(' + i + ')">'
    + '<div class="swho"><span class="sdot' + (a.active ? '' : ' no') + '"></span>'
    + '<div style="min-width:0"><div class="snm">' + esc(a.full_name || a.email)

    + (a.external ? ' <span class="stag" style="color:var(--red);border-color:var(--red)">not @speedyins</span>' : '')
    + (a.active ? '' : ' <span class="stag">cannot sign in</span>') + '</div>'
    + '<div class="sem">' + esc(a.email)
    + (a.producer_code ? ' · <span class="spc">' + esc(a.producer_code) + '</span>' : '') + '</div></div></div>'
    + branchCell + roleChip
    + '<div class="sperms">' + summary + '</div>'
    + '<div class="scar">' + (open ? '&#9662;' : '&#8250;') + '</div>'
    /* The phone's second line. Same three facts, moved rather than hidden. */
    + '<div class="smob">' + roleChip + branchCell + '<div class="sperms">' + summary + '</div></div>'
    + '</div>';
  if (!open) return h;

  const dis = isMe ? ' disabled' : '';
  const branches = r.branches || [];
  h += '<div class="sedit" onclick="event.stopPropagation()">'

    + '<div class="selab">Details</div>'
    + '<div class="fields">'
    + '<div class="f"><label>Full name</label>'
    + '<input id="snm_' + i + '" value="' + esc(a.full_name || '') + '" oninput="staffChanged(' + i + ')">'
    + '<div class="fhint">Shown on receipts and in the audit log.</div></div>'
    /* A DROPDOWN, Saif's choice — the branch has to be one of the five HawkSoft offices
       or the pre-selection at sign-in matches nothing. Free text let a typo through. */
    /* A DROPDOWN of the five real offices, Saif's choice — free text let a typo through
       and a typo means the sign-in pre-selection matches nothing. All 18 live rows
       already hold exactly one of these five names or null, checked against the table.
       A value from OUTSIDE the list (only reachable by direct SQL) is kept as its own
       selected option rather than falling back to "no branch": without that, opening
       the row and saving anything at all would silently WIPE the branch. */
    + '<div class="f"><label>Home branch</label>'
    + '<select id="sbr_' + i + '" onchange="staffChanged(' + i + ')">'
    + '<option value=""' + (a.branch ? '' : ' selected') + '>— no branch —</option>'
    + branches.map(b => '<option value="' + esc(b) + '"' + (a.branch === b ? ' selected' : '') + '>' + esc(b) + '</option>').join('')
    + ((a.branch && !branches.includes(a.branch))
        ? '<option value="' + esc(a.branch) + '" selected>' + esc(a.branch) + ' — not one of the five offices</option>'
        : '')
    + '</select>'
    + '<div class="fhint">Pre-selects their office at sign-in. They can still pick another one.</div></div>'
    + '<div class="f"><label>Producer code</label>'
    + '<input class="pcin" id="spc_' + i + '" maxlength="8" value="' + esc(a.producer_code || '') + '" oninput="staffChanged(' + i + ')">'
    + '<div class="fhint">From HawkSoft. Stamped on every payment they write.</div></div>'
    + '<div class="f"><label>Role</label>'
    + '<select id="srole_' + i + '"' + dis + (isMe ? ' title="you cannot change your own role"' : '')
    + ' onchange="staffChanged(' + i + ')">'
    + (r.roles || []).map(x => '<option value="' + esc(x) + '"' + (x === a.role ? ' selected' : '') + '>' + esc(x) + '</option>').join('')
    + '</select>'
    + '<div class="fhint">Sets the permissions below before anything extra is added.</div></div>'
    + '<div class="f"><label>Sign-in</label>'
    + '<label class="ssw' + (a.active ? ' on' : '') + (isMe ? ' dis' : '') + '" id="sswl_' + i + '">'
    + '<span>' + (a.active ? 'can sign in' : 'cannot sign in') + '</span>'
    + '<input type="checkbox" id="sact_' + i + '"' + (a.active ? ' checked' : '') + dis
    + ' onchange="staffSw(' + i + ')"><span class="tog"></span></label>'
    + '<div class="fhint">Switching this off never removes their name from past work.</div></div>'
    + '</div>'

    /* EDITABLE, at Saif's request — and present at all only because dropping it was the

           to the row rather than to the pill and still be unambiguous. */
        return '<label class="pill2' + (via ? ' via' : (a.grants.includes(c) ? ' on' : ''))
          + '" data-lab="' + esc(capLabel(c)) + '" data-tip="' + esc(tip) + '"'
          + ' title="' + esc(tip) + '" id="sgl_' + i + '_' + esc(c) + '">'
          + '<span class="tick">&#10003;</span>'
          + (via ? '' : '<input type="checkbox" id="sg_' + i + '_' + esc(c) + '"'
              + (a.grants.includes(c) ? ' checked' : '') + ' onchange="staffPill(' + i + ',\'' + esc(c) + '\')">')
          + esc(capLabel(c))
          + (via ? ' <small>· via ' + esc(a.role) + '</small>' : '')
          + '</label>';
      }).join('')
    + '</div>'
    /* Hover is not available on a phone and it is not discoverable on a desktop either,
       so the same sentences are one tap away. Native <details>: no state, no handler. */
    + '<details class="capdefs"><summary>What does each permission actually let them do?</summary><dl>'
    + (r.grantable || []).map(c => '<dt>' + esc(capLabel(c)) + '</dt><dd>' + esc(capHelp(c)) + '</dd>').join('')
    + '</dl></details>'

    + '<div class="sfoot">'
    + '<span>Added ' + esc(a.created_at ? String(a.created_at).slice(0, 10) : 'before this page existed') + '</span>'
    /* The separator is hidden on a phone, where the two facts wrap onto separate lines
       and the dot was left stranded at the end of the first one. */
    + '<span class="sep">·</span>'
    /* "never changed here" read as "never used", which is what made Saif ask how a
       working agent could show "never charge". It means only that nobody has edited
       this record from THIS page — say that. */

        ? 'last changed from this page by ' + esc(String(a.updated_by).split('@')[0])
          + (a.updated_at ? ' on ' + esc(String(a.updated_at).slice(0, 10)) : '')

    + '<div id="sfoot_' + i + '"></div>'
    + '</div>';
  return h;

    + chip('all', 'All') + chip('owners', 'Owners &amp; admins') + chip('extras', 'Has extras') + chip('off', 'Off')
    + '</div>'
    + '<button class="sadd" onclick="staffShowAdd()">+ Add someone</button>'
    + '</div><div id="saddbox"></div>';

  /* GROUPED BY ROLE — Saif's choice. Owners and admins first because those are the rows
     with power and the ones worth noticing; switched-off last because they are history. */
  const groups = [
    ['Owners & admins', rows.filter(a => a.role !== 'agent' && a.active)],
    ['Agents', rows.filter(a => a.role === 'agent' && a.active)],
    ['Switched off', rows.filter(a => !a.active)],
  ];
  let shown = 0;
  for (const g of groups) {
    const vis = g[1].filter(staffMatches);
    if (!vis.length) continue;
    shown += vis.length;
    h += '<div class="sgrp">' + esc(g[0]) + ' · ' + vis.length + '</div>' + vis.map(staffRowHtml).join('');
  }
  if (!shown) h += '<div class="muted" style="font-size:13px;padding:18px 2px">Nobody matches that.</div>';

  h += '<div class="shint" style="margin-top:18px;border-top:1px solid var(--line);padding-top:13px">'
    + (r.owners_active || 0) + ' active owner' + (r.owners_active === 1 ? '' : 's') + '. '
    + 'The last one cannot be demoted or switched off, and nobody can change their own role — '
    + 'that is how you lock everyone out of the screen you would need to fix it.</div>';
  return h;
}

function staffToggle(i) {
  STAFF_OPEN = (STAFF_OPEN === Number(i)) ? null : Number(i);
  $('#view').innerHTML = staffHtml();
}
function staffFilter(k) { STAFF_FILTER = k; STAFF_OPEN = null; $('#view').innerHTML = staffHtml(); }
/* Re-renders the list and then restores focus and the caret, because rebuilding the
   markup on every keystroke would otherwise drop the cursor out of the search box. */
function staffSearch(v) {
  STAFF_Q = v;
  const box = $('#sq'), pos = box ? box.selectionStart : null;
  $('#view').innerHTML = staffHtml();
  const nb = $('#sq');
  if (nb) { nb.focus(); if (pos != null && nb.setSelectionRange) nb.setSelectionRange(pos, pos); }

/* The switch and the pills carry their state in a hidden checkbox — the real value
   staffPending reads — and their LOOK in a class. Syncing the class here rather than
   with :has() means the on state renders the same on an older browser as a new one. */
function staffSw(i) {
  const box = byId('sact_' + i), lab = byId('sswl_' + i);
  if (!box || !lab) return;
  lab.classList.toggle('on', box.checked);
  const t = lab.querySelector('span');
  if (t) t.textContent = box.checked ? 'can sign in' : 'cannot sign in';
  staffChanged(i);
}
function staffPill(i, cap) {
  const box = byId('sg_' + i + '_' + cap), lab = byId('sgl_' + i + '_' + cap);
  if (!box || !lab) return;
  lab.classList.toggle('on', box.checked);
  staffChanged(i);
}

/* Runs on every input in an open editor. Writes the diff and the reason box only when
   something actually differs from what was loaded. */
function staffChanged(i) {
  const a = staffAt(i), foot = byId('sfoot_' + i);
  if (!a || !foot) return;
  const p = staffPending(i);
  /* Keeps what is already typed. Rewriting this block on every keystroke used to
     replace the reason input mid-sentence and lose the caret. */
  const had = byId('swhy_' + i);
  const kept = had ? had.value : '';
  if (!p.changed.length) { foot.innerHTML = ''; return; }
  foot.innerHTML = '<div class="sdiff">Changing: <b>' + p.changed.map(esc).join('</b>, <b>') + '</b></div>'
    + '<div class="ssave"><input id="swhy_' + i + '" placeholder="Why is this changing? (required)"'
    + ' value="' + esc(kept) + '">'
    + '<button onclick="saveAgent(' + i + ')">Save change</button></div>'
    + '<div id="smsg_' + i + '" class="shint" style="margin-top:7px"></div>';
  if (!had) { const w = byId('swhy_' + i); if (w) w.focus(); }
}

async function saveAgent(i) {
  const a = staffAt(i); if (!a) return;
  const p = staffPending(i);
  const msg = byId('smsg_' + i);
  const say = (t, bad) => { if (msg) { msg.textContent = t; msg.style.color = bad ? 'var(--red)' : 'var(--green)'; } };
  const why = ((byId('swhy_' + i) || {}).value || '').trim();
  if (!p.changed.length) return say('Nothing has changed.', true);
  if (!why) return say('A reason is required — it is what makes this explainable later.', true);
  say('Saving…');
  const res = await apiPostBody({ action: 'save_agent', email: a.email, reason: why,
    role: p.role, active: p.active, grants: p.grants, full_name: p.full_name,
    branch: p.branch, producer_code: p.producer_code, notes: p.notes });
  if (res && res.ok) { STAFF_OPEN = null; await renderStaff($('#view')); }
  else say((res && res.error) || 'Could not save.', true);
}

/* Adding someone GRANTS ACCESS to a mailbox that already exists — never an invitation.
   Hidden until asked for, so it is not a permanent empty form on the page. */
function staffShowAdd() {

async function addAgent() {
  const g = id => ((byId(id) || {}).value || '').trim();
  const msg = byId('snew_msg');
  const say = (t, bad) => { if (msg) { msg.textContent = t; msg.style.color = bad ? 'var(--red)' : 'var(--green)'; } };
  const email = g('snew_email').toLowerCase();
  if (!email) return say('An email is required.', true);

    role: 'agent', grants: [], active: true, notes: '' });

}

/* ================= REFUNDS TAB — Tony's half, and stage 5 =================
   Two queues and a history. "Waiting for you" is agents' refund requests; Approve
   issues the refund through the same server path an owner uses, with the agent's
   answers. "Carrier still owes us" is every refund the carrier has not answered on —
   the figure Trust already reports as carrier_to_recover, as a list with names on it,
   because a number nobody can act on is how the $141.00 gap sat unnoticed. */
let RQ_DATA = null;

async function renderRefunds(el) {
  el.innerHTML = '<h2>Refunds</h2><div class="load">Loading…</div>';
  let r = null;
  try { r = await api('refund_requests'); } catch (e) { r = null; }
  if (!r) { el.innerHTML = '<h2>Refunds</h2><div class="err">No response from the server.</div>'; return; }
  if (!r.ok) { el.innerHTML = '<h2>Refunds</h2><div class="err">' + esc(r.error || 'Not permitted') + '</div>'; return; }
  RQ_DATA = r;
  el.innerHTML = refundsHtml();
}

const rqReason = c => ({ charged_twice: 'charged twice', wrong_amount: 'wrong amount taken',
  policy_cancelled: 'policy cancelled', never_bound: 'never bound', other: 'other' })[c] || c;
const rqOwes = c => (c === 'policy_cancelled' || c === 'never_bound') ? 'closes the obligation' : 'the client still owes it';
const rqAgo = ts => {
  const m = Math.round((Date.now() - new Date(ts).getTime()) / 60000);
  return m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago';
};

function refundsHtml() {
  const r = RQ_DATA, pend = r.pending || [], carr = r.carrier_pending || [], done = r.decided || [];
  let h = '<h2>Refunds</h2>'
    + '<div class="muted" style="font-size:13px;margin-bottom:14px;line-height:1.5">'
    + 'Requests from agents wait here for you. Approving one issues the refund straight away with the agent’s answers '
    + '— the same thing as doing it yourself from the client card. Declining needs a reason; the agent reads it.</div>';

  /* ---- waiting for you ---- */
  h += '<div class="sgrp">Waiting for you · ' + pend.length + '</div>';
  if (!pend.length) h += '<div class="muted" style="font-size:13px;padding:6px 2px 14px">Nothing waiting.</div>';
  for (const q of pend) {
    const p = q.payment || {};
    const nz = q.notify || {};
    h += '<div class="rq" id="rq_' + esc(q.id) + '">'
      + '<div class="row" style="align-items:flex-start;gap:10px">'
      + '<div><b style="font-size:15px">' + money(q.amount) + '</b>'
      + (Number(q.amount) + 0.004 < Number(p.amount || 0) ? ' <span class="lbl">part</span>' : '')
      + ' <span class="muted" style="font-size:13px">of ' + money(p.amount) + ' · client ' + esc(String(q.client_no || ''))
      + (q.client_name ? ' ' + esc(q.client_name) : '') + '</span></div>'
      + '<span class="lbl amber">needs you</span></div>'
      + '<div class="muted" style="font-size:13px;margin-top:3px">Asked by <b style="color:var(--ink)">' + esc(q.requested_by_name || q.requested_by) + '</b>'
      + ' · ' + rqAgo(q.requested_at) + ' · ' + esc(rqReason(q.reason)) + ' — ' + rqOwes(q.reason)
      + ' · carrier money ' + (q.carrier === 'yes' ? 'returned' : q.carrier === 'no' ? '<b style="color:var(--red)">not returned — a loss</b>' : 'not back yet') + '</div>'
      + '<div class="muted" style="font-size:12px;margin-top:3px">Payment: ' + esc(String(p.ts || '').slice(0, 10))
      + ' · ' + esc(p.purpose || '') + (p.ref ? ' · ' + esc(p.ref) : '')
      + (p.carrier_name ? ' · ' + esc(p.carrier_name) + (p.service_cost != null ? ' ' + money(p.service_cost) : '') : '')
      + (p.fee_amount != null ? ' · Speedy kept ' + money(p.fee_amount) : '')
      + ' · commission to ' + esc(p.commission_to_name || '—') + '</div>'
      + '<div class="rqnote">“' + esc(q.note) + '”</div>'
      + '<ul class="will">'
      + '<li>' + (nz.channel === 'email' ? 'Client emailed at <b>' + esc(nz.to) + '</b>' + (nz.source === 'typed' ? ' <span style="color:var(--amber)">(typed by the agent, not from the record)</span>' : '')
                 : '<span style="color:var(--red)">Client NOT told</span> — ' + esc(nz.skip_reason || '')) + '</li>'
      + (p.fee_amount != null ? '<li>' + esc(String(p.commission_to_name || 'the agent').split(' ')[0]) + '’s commission on this reverses, this month</li>' : '<li>Never audited — no commission to reverse</li>')
      + (p.service_cost != null && q.carrier !== 'yes' ? '<li>' + money(p.service_cost) + ' carrier cost ' + (q.carrier === 'no' ? '<span style="color:var(--red)">is a loss</span>' : 'held for recovery') + '</li>' : '')
      + '<li>A note goes on the HawkSoft file; the receipt stays</li>'
      + '</ul>'
      + '<div id="rqmsg_' + esc(q.id) + '" class="shint" style="margin-top:6px;min-height:0"></div>'
      /* THE OWNER MAY CHANGE THE AMOUNT (Saif, Sep 15) - full to part, or less. The
         box starts at what was asked; the button follows it; the cap is what is still
         refundable on the payment. */
      + '<div class="rqamt"><span class="muted" style="font-size:13px">Approve</span><span style="font-weight:700">$</span>'
      + '<input id="rqamt_' + esc(q.id) + '" type="text" inputmode="decimal" value="' + esc(Number(q.amount).toFixed(2)) + '" oninput="rqAmtChanged(\'' + esc(q.id) + '\', this.value)">'
      + '<span class="muted" style="font-size:13px">of ' + money(q.refundable != null ? q.refundable : p.amount) + ' refundable</span>'
      + '<span id="rqamtnote_' + esc(q.id) + '" class="muted" style="font-size:12px"></span></div>'
      /* THE NOTICE (Saif, Sep 15): the agent's choice is the default; the owner may pick
         an address on the record, type one, or say why not. Same shape the sheet sends. */
      + '<div class="rqnz" id="rqnz_' + esc(q.id) + '">' + rqNoticeHtml(q) + '</div>'
      + '<div class="rqacts">'
      + '<button class="rqok" id="rqok_' + esc(q.id) + '" onclick="decideRefund(\'' + esc(q.id) + '\', true)">Approve &amp; refund ' + money(q.amount) + '</button>'
      + '<button class="rqno" onclick="declineRefund(\'' + esc(q.id) + '\')">Decline…</button>'
      + '</div></div>';
  }

  /* ---- carrier recovery ---- */
  h += '<div class="sgrp" style="margin-top:22px">Carrier still owes us · ' + carr.length + ' · ' + money(r.carrier_pending_total || 0) + '</div>';
  if (!carr.length) h += '<div class="muted" style="font-size:13px;padding:6px 2px 14px">Nothing outstanding.</div>';
  else h += '<div class="muted" style="font-size:13px;margin-bottom:8px;line-height:1.5">Refunds where the carrier has not answered on their share. '
    + 'Nothing chases these on their own. When you know — a remittance, a call, a statement — settle each one.</div>';
  for (const c of carr) {
    h += '<div class="rq" id="cr_' + esc(c.refund_id) + '">'
      + '<div class="row" style="align-items:flex-start;gap:10px">'
      + '<div><b>' + esc(c.carrier_name || 'carrier not named') + '</b> <span class="muted" style="font-size:13px">· client '
      + esc(String(c.client_no)) + (c.client_name ? ' ' + esc(c.client_name) : '') + ' · refunded ' + esc(String(c.refunded_at || '').slice(0, 10)) + '</span></div>'
      + '<b>' + money(c.carrier_cost) + '</b></div>'
      + '<div class="muted" style="font-size:12px;margin-top:3px">' + money(c.amount) + ' went back to the client · ' + esc(rqReason(c.reason))
      + (c.refunded_by ? ' · by ' + esc(c.refunded_by) : '') + '</div>'
      + (c.note ? '<div class="rqnote">“' + esc(c.note) + '”</div>' : '')
      + '<div id="crmsg_' + esc(c.refund_id) + '" class="shint" style="margin-top:6px;min-height:0"></div>'
      + '<div class="rqacts">'
      + '<button class="rqok" onclick="settleCarrier(\'' + esc(c.refund_id) + '\', \'yes\')">They paid us back</button>'
      + '<button class="rqno" onclick="settleCarrier(\'' + esc(c.refund_id) + '\', \'no\')">It’s a loss</button>'
      + '</div></div>';
  }

  /* ---- history ---- */
  if (done.length) {
    h += '<div class="sgrp" style="margin-top:22px">Decided · last ' + done.length + '</div>';
    for (const q of done) {
      const changed = q.status === 'approved' && q.approved_amount != null && Math.abs(q.approved_amount - q.amount) > 0.004;
      const nzd = q.client_notice || null;
      const canMail = q.status === 'approved' && q.refund_id && (!nzd || nzd.result !== 'sent');
      h += '<div class="rq" style="opacity:.8" id="rqd_' + esc(q.id) + '">'
        + '<div class="row"><div>' + (changed ? money(q.approved_amount) + ' <span class="muted" style="font-size:13px">approved of ' + money(q.amount) + ' asked</span>' : money(q.amount)) + ' <span class="muted" style="font-size:13px">· client ' + esc(String(q.client_no || ''))
        + (q.client_name ? ' ' + esc(q.client_name) : '') + ' · asked by ' + esc(q.requested_by_name || q.requested_by) + '</span></div>'
        + '<span class="lbl ' + (q.status === 'approved' ? 'green' : 'red') + '">' + esc(q.status) + '</span></div>'
        + '<div class="muted" style="font-size:12px;margin-top:3px">' + esc(q.status) + ' by ' + esc(q.decided_by_name || q.decided_by || '')
        + ' on ' + esc(String(q.decided_at || '').slice(0, 10)) + (q.decision_note ? ' — “' + esc(q.decision_note) + '”' : '') + '</div>'
        + (q.status === 'approved' && nzd
            ? '<div class="muted" style="font-size:12px;margin-top:3px">' + (nzd.result === 'sent'
                ? 'Client emailed at <b style="color:var(--ink)">' + esc(nzd.to) + '</b>' + (nzd.late ? ' (sent afterwards by ' + esc(String(nzd.chosen_by || '').split('@')[0]) + ')' : '')
                : nzd.result === 'failed' ? '<span style="color:var(--red)">Email to ' + esc(nzd.to || '') + ' FAILED</span>' + (nzd.detail ? ' — ' + esc(nzd.detail) : '')
                : '<span style="color:var(--amber)">Client not told</span>' + (nzd.skip_reason ? ' — ' + esc(nzd.skip_reason) : '')) + '</div>'
            : '')
        + ((canMail || (q.status === 'approved' && q.refund_id))
            ? '<div id="rqdmsg_' + esc(q.id) + '" class="shint" style="margin-top:6px;min-height:0"></div><div class="rqacts">'
              + (canMail ? '<button class="rqok" style="background:var(--blue)" onclick="notifyRefund(\'' + esc(q.id) + '\')">Email the client…</button>' : '')
              /* the slip the client can be handed - the same PDF the platform filed with the refund (Sep 15) */
              + (q.refund_id ? '<button class="rqok rqslip" onclick="openRefundSlip(\'' + esc(q.refund_id) + '\',\'en\')">Refund confirmation</button>'
                  + '<button class="rqok rqslip" onclick="openRefundSlip(\'' + esc(q.refund_id) + '\',\'es\')">Español</button>' : '')
              + '</div>'
            : '')
        + '</div>';
    }
  }
  return h;
}

/* Every outcome — approved, declined, or the refund failing at Clover — is said on the
   card itself. A request whose approval FAILED stays in the queue, because the money
   did not move, and the message says so. */
function rqParse(v){ const n = Math.round(Number(String(v || '').replace(/[^0-9.]/g, '')) * 100) / 100; return Number.isFinite(n) ? n : 0; }
/* the notice picker on a pending request: chips for the addresses on the record, a
   typed address, or "don't - because". RQ_NZ holds the owner's choice per request;
   absent means "as the agent asked". */
const RQ_NZ = {};
function rqNoticeOf(q){ return RQ_NZ[q.id] || q.notify || { channel: 'none', skip_reason: '' }; }
function rqNoticeHtml(q){
  const nz = rqNoticeOf(q); const emails = q.client_emails || [];
  const chip = (on, onclick, label) => '<button class="rqchip' + (on ? ' on' : '') + '" onclick="' + onclick + '">' + label + '</button>';
  let h = '<div class="muted" style="font-size:13px;margin-bottom:4px">Tell the client' + (RQ_NZ[q.id] ? ' <span style="color:var(--amber)">(changed from what ' + esc(String(q.requested_by_name || q.requested_by).split(' ')[0]) + ' asked)</span>' : '') + '</div><div class="rqchips">'
    + emails.map(e => chip(nz.channel === 'email' && nz.source === 'on_file' && nz.to === String(e).toLowerCase(), "rqNotify('" + esc(q.id) + "','on_file'," + JSON.stringify(String(e).toLowerCase()).replace(/"/g, '&quot;') + ")", 'Email ' + esc(e))).join('')
    + chip(nz.channel === 'email' && nz.source === 'typed', "rqNotify('" + esc(q.id) + "','typed')", emails.length ? 'A different address…' : 'Type an address…')
    + chip(nz.channel === 'none', "rqNotify('" + esc(q.id) + "','none')", 'Don’t notify')
    + '</div>';
  if (nz.channel === 'email' && nz.source === 'typed') h += '<input class="rqin" id="rqto_' + esc(q.id) + '" type="email" placeholder="name@example.com" value="' + esc(nz.to || '') + '" oninput="rqNotifyTo(\'' + esc(q.id) + '\', this.value)">'
    + '<div class="muted" style="font-size:12px;margin-top:3px">Not on the record — the refund will say it was typed by you. Check it: a wrong address sends the client’s name and the amount to a stranger.</div>';
  else if (nz.channel === 'none') h += '<input class="rqin" id="rqskip_' + esc(q.id) + '" placeholder="Why not? (recorded)" value="' + esc(nz.skip_reason || '') + '" oninput="rqNotifySkip(\'' + esc(q.id) + '\', this.value)">';
  else if (!emails.length && nz.channel !== 'email') h += '<div class="muted" style="font-size:12px;margin-top:3px">No email on this client’s record.</div>';
  return h;
}
function rqNotify(id, kind, addr){
  const q = (RQ_DATA.pending || []).find(x => x.id === id); if (!q) return;
  const cur = rqNoticeOf(q);
  if (kind === 'on_file') RQ_NZ[id] = { channel: 'email', to: addr, source: 'on_file' };
  else if (kind === 'typed') RQ_NZ[id] = { channel: 'email', to: cur.source === 'typed' ? (cur.to || '') : '', source: 'typed' };
  else RQ_NZ[id] = { channel: 'none', skip_reason: cur.channel === 'none' ? (cur.skip_reason || '') : '' };
  const el = $('#rqnz_' + id); if (el) el.innerHTML = rqNoticeHtml(q);
  const f = $('#rqto_' + id) || $('#rqskip_' + id); if (f) f.focus();
}
function rqNotifyTo(id, v){ if (RQ_NZ[id]) RQ_NZ[id].to = String(v || '').trim().toLowerCase(); }
function rqNotifySkip(id, v){ if (RQ_NZ[id]) RQ_NZ[id].skip_reason = String(v || '').trim(); }
function rqNoticeOk(nz){ return !!(nz && ((nz.channel === 'email' && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(nz.to || ''))) || (nz.channel === 'none' && String(nz.skip_reason || '').trim()))); }
/* email the client about a refund that already went out without one */
async function notifyRefund(id){
  const q = (RQ_DATA.decided || []).find(x => x.id === id); if (!q || !q.refund_id) return;
  const msg = $('#rqdmsg_' + id);
  const say = (t, bad) => { if (msg) { msg.textContent = t; msg.style.color = bad ? 'var(--red)' : 'var(--green)'; } };
  const guess = (q.client_emails || [])[0] || '';
  const to = prompt('Email the client about this refund of ' + money(q.approved_amount != null ? q.approved_amount : q.amount) + '.\n\nSend to:', guess);
  if (to == null) return;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(to).trim())) return say('That is not an email address.', true);
  say('Sending…');
  const r = await apiPostBody({ action: 'notify_refund', refund_id: q.refund_id, to: String(to).trim().toLowerCase() });
  if (r && r.ok) { say('Sent to ' + r.client_notice.to + '.' + (r.hawksoft_note ? '' : ' (The HawkSoft note did not file.)')); await renderRefunds($('#view')); return; }
  say((r && (r.error || r.message)) || 'Could not send it.', true);
}
function rqAmtChanged(id, v) {
  const q = (RQ_DATA.pending || []).find(x => x.id === id); if (!q) return;
  const cap = q.refundable != null ? q.refundable : Number((q.payment || {}).amount || 0);
  const n = rqParse(v);
  const ok = n >= 0.01 && n <= cap + 0.004;
  const btn = $('#rqok_' + id), note = $('#rqamtnote_' + id);
  if (btn) { btn.disabled = !ok; btn.style.opacity = ok ? '' : '.45'; btn.textContent = ok ? 'Approve & refund ' + money(n) : 'Enter an amount up to ' + money(cap); }
  if (note) note.textContent = !ok ? '' : Math.abs(n - Number(q.amount)) > 0.004 ? (n < Number(q.amount) ? 'part of the ' + money(q.amount) + ' asked · the fee and carrier shares scale to it' : 'more than the ' + money(q.amount) + ' asked') : '';
}
async function decideRefund(id, approve, note) {
  const msg = $('#rqmsg_' + id);
  const say = (t, bad) => { if (msg) { msg.textContent = t; msg.style.color = bad ? 'var(--red)' : 'var(--green)'; } };
  const q = (RQ_DATA.pending || []).find(x => x.id === id); if (!q) return;
  const box = $('#rqamt_' + id);
  const amt = approve ? (box ? rqParse(box.value) : Number(q.amount)) : null;
  if (approve) {
    const cap = q.refundable != null ? q.refundable : Number((q.payment || {}).amount || 0);
    if (!(amt >= 0.01 && amt <= cap + 0.004)) return say('Enter an amount between $0.01 and ' + money(cap) + '.', true);
  }
  const changed = approve && Math.abs(amt - Number(q.amount)) > 0.004;
  const nzUse = approve ? rqNoticeOf(q) : null;
  if (approve && RQ_NZ[id] && !rqNoticeOk(nzUse)) return say(nzUse.channel === 'email' ? 'Enter the client’s email address.' : 'Say why the client is not being told.', true);
  if (approve && !confirm('Refund ' + money(amt) + ' to client ' + q.client_no + ' now' + (changed ? ' (' + (q.requested_by_name || q.requested_by) + ' asked for ' + money(q.amount) + ')' : ', as ' + (q.requested_by_name || q.requested_by) + ' asked') + '?\n\nThis cannot be undone from here.')) return;
  say(approve ? 'Refunding…' : 'Declining…');
  const r = await apiPostBody({ action: 'decide_refund', request_id: id, approve: !!approve, note: note || '', ...(approve ? { amount: amt } : {}), ...(approve && RQ_NZ[id] ? { notify: nzUse } : {}) });
  if (r && r.ok) delete RQ_NZ[id];
  if (r && r.ok) {
    if (approve) {
      const cn = r.client_notice || {};
      const told = cn.result === 'sent' ? 'Client emailed at ' + cn.to + '.'
        : cn.result === 'failed' ? 'EMAIL FAILED to ' + cn.to + ' (' + (cn.detail || '') + ') — the client has NOT been told.'
        : 'The client was not emailed' + (cn.skip_reason ? ' — ' + cn.skip_reason : '') + '.';
      alert('Refunded. ' + (r.tell_the_client || '') + '\n\n' + told + (r.hawksoft_note ? '' : '\n\nNote: the HawkSoft note did not file. Tell Saif.'));
    }
    await renderRefunds($('#view'));
    return;
  }
  say((r && (r.message || r.error)) || 'Could not decide that request.'
    + (r && r.request_still_pending ? ' It is still waiting.' : ''), true);
}
function declineRefund(id) {
  const why = prompt('Why is this declined? The agent will read this.');
  if (why == null) return;
  if (!why.trim()) { const m = $('#rqmsg_' + id); if (m) { m.textContent = 'A reason is required.'; m.style.color = 'var(--red)'; } return; }
  decideRefund(id, false, why.trim());
}
async function settleCarrier(refundId, answer) {
  const msg = $('#crmsg_' + refundId);
  const say = (t, bad) => { if (msg) { msg.textContent = t; msg.style.color = bad ? 'var(--red)' : 'var(--green)'; } };
  const why = prompt(answer === 'yes'
    ? 'How do you know the carrier paid us back? (remittance, call, statement — this is recorded)'
    : 'How do you know it is a loss? (this is recorded, and it moves to Trust’s loss line)');
  if (why == null) return;
  if (!why.trim()) return say('A reason is required.', true);
  say('Saving…');
  const r = await apiPostBody({ action: 'settle_carrier', refund_id: refundId, carrier: answer, note: why.trim() });
  if (r && r.ok) { await renderRefunds($('#view')); return; }
  say((r && r.error) || 'Could not settle that one.', true);
}

async function renderHealth(el) {
  el.innerHTML = '<div class="card"><div class="muted">Reconciling money against paperwork…</div></div>';
  const r = await api('health_check');
  if (!r || !r.ok) { el.innerHTML = '<div class="card"><div class="muted">Could not run the check.</div></div>'; return; }

  const sevPill = s => s === 'high'
    ? '<span class="pill r">needs attention</span>'
    : '<span class="pill a">worth a look</span>';

  let h = '<div class="card">';
  h += '<div class="row" style="align-items:flex-start;margin-bottom:6px"><div>'
    + '<h2 style="margin:0">Health check</h2>'
    + '<div class="muted" style="font-size:13px;margin-top:3px">Where the money and the paperwork disagree. '
    + esc(r.checked) + ' payments and ' + esc(r.documents) + ' documents examined.</div></div>'
    + '<button class="btn" onclick="render()">Run again</button></div>';

  if (!r.issues.length) {
    h += '<div style="background:rgba(47,191,113,.12);border:1px solid rgba(47,191,113,.4);border-radius:12px;padding:16px;margin-top:10px">'
      + '<div style="font-size:15px;font-weight:800;color:var(--green)">✓ Everything reconciles</div>'
      + '<div class="muted" style="font-size:13px;margin-top:3px">Every charge has its receipt, every audit its figures, every payment an owner.</div></div>';
  } else {
    for (const i of r.issues) {
      h += '<div style="border:1px solid ' + (i.sev === 'high' ? 'rgba(224,49,49,.4)' : 'rgba(245,166,35,.4)')
        + ';border-radius:12px;padding:13px;margin-top:10px">'
        + '<div class="row" style="align-items:flex-start"><div>'
        + '<div style="font-size:14px;font-weight:800">' + esc(i.title) + '</div>'
        + '<div class="muted" style="font-size:13px;margin-top:2px">' + esc(i.why) + '</div></div>'
        + '<div style="text-align:right"><div style="font-size:19px;font-weight:800">' + i.count + '</div>'
        + sevPill(i.sev) + '</div></div>';
      h += '<table style="margin-top:9px"><tr><th>When</th><th>Client</th><th>Detail</th><th></th></tr>';
      for (const row of i.rows) {
        h += '<tr><td>' + esc(PT_DAY(row.ts)) + '</td>'
          + '<td><span class="raw-t" onclick="openClient(' + (row.client_no || 0) + ')">#' + esc(row.client_no || '—') + '</span></td>'
          + '<td>' + (row.filename ? esc(row.filename) : money(row.amount) + ' · ' + esc(row.kind || ''))
          + (row.audit_status ? ' · ' + esc(row.audit_status) : '') + '</td>'
          + '<td class="muted">' + esc(row.agent ? String(row.agent).split('@')[0] : '') + '</td></tr>';
      }
      h += '</table>';
      if (i.count > i.rows.length) h += '<div class="muted" style="font-size:12px;margin-top:6px">Showing ' + i.rows.length + ' of ' + i.count + '.</div>';
      h += '</div>';
    }
  }
  h += '<div class="muted" style="font-size:12px;margin-top:12px">Receipts have only been stored since Aug 5, so earlier charges are not reported as missing one.</div>';
  h += '</div>';
  el.innerHTML = h;
}

async function renderTables(el) {
  const r = await api('tables');
  if (!r || !r.ok) { el.innerHTML = '<div class="err">Table inventory failed.</div>'; return; }
  let h = '<h2>Our database — what exists today</h2>';
  h += '<table><tr><th>Table</th><th>Status</th><th>Rows</th><th>Columns</th></tr>'
    + (r.tables || []).map(t => '<tr>'
      + '<td><span class="amount">' + esc(t.table) + '</span></td>'
      + '<td>' + (t.exists ? '<span class="pill g">live</span>' : '<span class="pill r">missing</span>') + '</td>'
      + '<td>' + (t.rows === null ? '—' : t.rows) + '</td>'
      + '<td class="muted">' + esc((t.columns || []).join(', ') || '—') + '</td>'
      + '</tr>').join('') + '</table>';
  h += '<p class="muted" style="font-size:13px;margin-top:14px">Coming as the platform grows: <b>events</b> · <b>clients</b> · <b>policies</b> (canonical schema, B0) · <b>invoices</b> (A3) · <b>tasks</b> (D1).</p>';
  el.innerHTML = h;
  // append live system-health panel
  try { const hh = await renderSystemHealth(); const d = document.createElement('div'); d.innerHTML = hh; el.appendChild(d); } catch(e){}
}
</script>
